// ==================== DRAG ====================
let drag={active:false};

function startDrag(clientX,clientY,gid,type,idx,handle){
  const g=GbyId(gid);if(!g)return;
  const coord=getSVGCoords(clientX,clientY,gid);if(!coord)return;
  let origData=null;
  if(type==='point') origData={...g.points[idx]};
  else if(type==='line') origData={...g.lines[idx]};
  drag={active:true,gid,type,idx,handle,startCoord:coord,origData};
  document.addEventListener('pointermove',onDragMove,{passive:false});
  document.addEventListener('pointerup',onDragEnd);
}

function onDragMove(e){
  if(!drag.active)return;
  e.preventDefault();
  const clientX=e.clientX,clientY=e.clientY;
  const g=GbyId(drag.gid);if(!g)return;
  const coord=getSVGCoords(clientX,clientY,drag.gid);if(!coord)return;
  const dx=coord.x-drag.startCoord.x;
  const dy=coord.y-drag.startCoord.y;
  const od=drag.origData;

  if(drag.type==='point'){
    const raw={x:od.x+dx,y:od.y+dy};
    const snap=findSnapPoint(g,raw);
    const pt=snap||raw;
    g.points[drag.idx].x=roundCoord(pt.x);
    g.points[drag.idx].y=roundCoord(pt.y);
    _hoverSnap={gid:drag.gid,point:{x:pt.x,y:pt.y,snapped:!!snap,kind:snap?.type}};
  } else if(drag.type==='line'){
    const l=g.lines[drag.idx];
    if(drag.handle==='body'){
      if(l.type==='2pt'){l.x0=roundCoord(od.x0+dx);l.y0=roundCoord(od.y0+dy);l.x1=roundCoord(od.x1+dx);l.y1=roundCoord(od.y1+dy);}
      else if(l.type==='line'){l.int=roundCoord((od.int||0)+dy);}
      else if(l.type==='horiz'){l.yv=roundCoord((od.yv||0)+dy);}
      else if(l.type==='vert'){l.xv=roundCoord((od.xv||0)+dx);}
      else if(l.type==='curve'){l.int=Math.max(0.5,roundCoord((od.int||5)+dy));}
    } else if(drag.handle==='p0'){
      const raw={x:od.x0+dx,y:od.y0+dy};
      const snap=findSnapPoint(g,raw);const pt=snap||raw;
      l.x0=roundCoord(pt.x);l.y0=roundCoord(pt.y);
      _hoverSnap={gid:drag.gid,point:{x:pt.x,y:pt.y,snapped:!!snap,kind:snap?.type}};
    } else if(drag.handle==='p1'){
      const raw={x:od.x1+dx,y:od.y1+dy};
      const snap=findSnapPoint(g,raw);const pt=snap||raw;
      l.x1=roundCoord(pt.x);l.y1=roundCoord(pt.y);
      _hoverSnap={gid:drag.gid,point:{x:pt.x,y:pt.y,snapped:!!snap,kind:snap?.type}};
    } else if(drag.handle==='p_left'||drag.handle==='p_right'){
      const anchorX=drag.handle==='p_left'?g.xMax:g.xMin;
      const anchorY=(od.slope||0)*anchorX+(od.int||0);
      const moveX=drag.handle==='p_left'?g.xMin+0.5:g.xMax-0.5;
      const moveY=(od.slope||0)*moveX+(od.int||0)+dy;
      const newSlope=Math.abs(moveX-anchorX)>0.01?(moveY-anchorY)/(moveX-anchorX):od.slope;
      l.slope=roundCoord(newSlope);
      l.int=roundCoord(anchorY-newSlope*anchorX);
    } else if(drag.handle==='fn_k'){
      // Body drag → move curve up/down (k = y-offset)
      l.fnK=roundCoord((parseFloat(od.fnK)||0)+dy);
    } else if(drag.handle==='fn_h'){
      // Left handle → shift curve left/right (h = x-offset)
      l.fnH=roundCoord((parseFloat(od.fnH)||0)-dx); // negative: drag right = shift curve left
    } else if(drag.handle==='fn_a'){
      // Right handle → scale (a = vertical stretch)
      // Drag up = increase a, drag down = decrease a
      const sensitivity=(g.yMax-g.yMin)*0.3;
      const newA=(parseFloat(od.fnA)||1)-dy/sensitivity*Math.abs(parseFloat(od.fnA)||1);
      l.fnA=roundCoord(Math.max(0.05,newA));
    } else if(drag.handle==='fn_shape'){
      // Shape handle → change the "main parameter" of the expression
      // Strategy: multiply fnA by a factor based on vertical drag
      // This intuitively changes curvature/spread
      const sensitivity=(g.yMax-g.yMin)*0.25;
      const factor=1-dy/sensitivity;
      const newA=(parseFloat(od.fnA)||1)*Math.max(0.05,factor);
      l.fnA=roundCoord(newA);
    }
  }
  refreshSVG(drag.gid);
  // live-update fn param display
  if(S.sel&&S.sel.idx===drag.idx&&S.sel.type==='line'){
    const ll=g.lines[drag.idx];
    if(ll&&ll.type==='fn'){
      const pa=document.querySelector('#rpanel-body [data-fnparam="a"]');
      const ph=document.querySelector('#rpanel-body [data-fnparam="h"]');
      const pk=document.querySelector('#rpanel-body [data-fnparam="k"]');
      if(pa) pa.value=ll.fnA; if(ph) ph.value=ll.fnH; if(pk) pk.value=ll.fnK;
    }
  }
  // live-update coord inputs for points
  if(S.sel&&S.sel.idx===drag.idx&&S.sel.type==='point'){
    const p=g.points[drag.idx];
    const ix=document.querySelector('#rpanel-body [data-coord="px"]');
    const iy=document.querySelector('#rpanel-body [data-coord="py"]');
    if(ix)ix.value=p.x; if(iy)iy.value=p.y;
  }
}

function onDragEnd(){
  if(!drag.active)return;
  drag.active=false;
  document.removeEventListener('pointermove',onDragMove);
  document.removeEventListener('pointerup',onDragEnd);
  _hoverSnap=null;
  renderAll();
  // refresh right panel if detail is open
  const rpBody=document.getElementById('rpanel-body');
  if(rpBody&&rpBody.querySelector('.pf-group')&&S.sel){
    renderRPanel({type:S.sel.type,idx:S.sel.idx});
  }
}

// Area vertex drag
function startAreaVtx(clientX,clientY,gid,aIdx,vIdx){
  const g=GbyId(gid);if(!g)return;
  const orig={...g.areas[aIdx].pts[vIdx]};
  const moveH=e=>{
    const coord=getSVGCoords(e.clientX,e.clientY,gid);if(!coord)return;
    const snap=findSnapPoint(g,coord);const pt=snap||coord;
    g.areas[aIdx].pts[vIdx]={x:roundCoord(pt.x),y:roundCoord(pt.y)};
    refreshSVG(gid);
  };
  const upH=()=>{
    document.removeEventListener('pointermove',moveH);
    document.removeEventListener('pointerup',upH);
    renderAll();
  };
  document.addEventListener('pointermove',moveH,{passive:false});
  document.addEventListener('pointerup',upH);
}

// ==================== HANDLES RENDERED INSIDE SVG ====================
function drawSelectionHandles(g,s,svgX,svgY){
  if(!S.sel||S.sel.gid!==g.id)return s;
  // Never draw handles in draw modes — they'd intercept clicks needed for drawing
  if(S.tool!=='select')return s;
  const {type,idx}=S.sel;
  const {W,H,pad,rightMargin}=getCanvasDims(g);
  const {coordType:ct}=g;
  let oy; if(ct==='q14'||ct==='all') oy=H/2; else oy=H-pad+6;
  const drawXMin=pad,drawXMax=W-rightMargin,drawYMin=18,drawYMax=oy<H-10?H-pad+6:H-22;
  const HIT=9;

  if(type==='point'&&g.points[idx]){
    const p=g.points[idx];
    const cx=svgX(p.x),cy=svgY(p.y);
    s+=`<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.7" style="pointer-events:none"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="16" fill="transparent" style="cursor:move"
      onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','point',${idx},'body')}"/>`;
  }

  if(type==='line'&&g.lines[idx]){
    const l=g.lines[idx]; const c=l.color||'#2563eb';
    if(l.type==='2pt'){
      const ax=svgX(l.x0),ay=svgY(l.y0),bx=svgX(l.x1),by=svgY(l.y1);
      s+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="14" stroke-opacity="0.1" style="cursor:move"
        onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'body')}"/>`;
      s+=`<circle cx="${ax}" cy="${ay}" r="${HIT}" fill="white" stroke="${c}" stroke-width="2.5" style="cursor:grab"
        onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'p0')}"/>`;
      s+=`<circle cx="${bx}" cy="${by}" r="${HIT}" fill="white" stroke="${c}" stroke-width="2.5" style="cursor:grab"
        onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'p1')}"/>`;
    } else if(l.type==='line'){
      const midX=(g.xMin+g.xMax)/2,midY=(l.slope||0)*midX+(l.int||0);
      if(midY>=g.yMin&&midY<=g.yMax){
        const mx=svgX(midX),my=svgY(midY);
        s+=`<rect x="${mx-22}" y="${my-9}" width="44" height="18" rx="5" fill="${c}" fill-opacity="0.12" style="cursor:move"
          onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'body')}"/>`;
        // slope handles at edges
        const lx0=g.xMin+0.5,ly0=(l.slope||0)*lx0+(l.int||0);
        const rx0=g.xMax-0.5,ry0=(l.slope||0)*rx0+(l.int||0);
        if(ly0>=g.yMin&&ly0<=g.yMax)
          s+=`<circle cx="${svgX(lx0)}" cy="${svgY(ly0)}" r="${HIT}" fill="white" stroke="${c}" stroke-width="2" style="cursor:ns-resize"
            onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'p_left')}"/>`;
        if(ry0>=g.yMin&&ry0<=g.yMax)
          s+=`<circle cx="${svgX(rx0)}" cy="${svgY(ry0)}" r="${HIT}" fill="white" stroke="${c}" stroke-width="2" style="cursor:ns-resize"
            onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'p_right')}"/>`;
      }
    } else if(l.type==='horiz'){
      const hy=svgY(l.yv||0);
      s+=`<rect x="${drawXMin}" y="${hy-9}" width="${drawXMax-drawXMin}" height="18" fill="${c}" fill-opacity="0.08" style="cursor:ns-resize"
        onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'body')}"/>`;
      s+=`<circle cx="${(drawXMin+drawXMax)/2}" cy="${hy}" r="${HIT}" fill="white" stroke="${c}" stroke-width="2" style="cursor:ns-resize"
        onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'body')}"/>`;
    } else if(l.type==='vert'){
      const vx=svgX(l.xv||0);
      s+=`<rect x="${vx-9}" y="${drawYMin}" width="18" height="${drawYMax-drawYMin}" fill="${c}" fill-opacity="0.08" style="cursor:ew-resize"
        onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'body')}"/>`;
      s+=`<circle cx="${vx}" cy="${(drawYMin+drawYMax)/2}" r="${HIT}" fill="white" stroke="${c}" stroke-width="2" style="cursor:ew-resize"
        onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'body')}"/>`;
    } else if(l.type==='curve'){
      const curv=l.curv||1.5,scl=l.int||8;
      const midX=(g.xMin+g.xMax)*0.35;
      if(midX>0){
        const midY=Math.pow(scl,curv)/Math.pow(midX,curv);
        if(midY>=g.yMin&&midY<=g.yMax){
          s+=`<circle cx="${svgX(midX)}" cy="${svgY(midY)}" r="11" fill="${c}" fill-opacity="0.15" stroke="${c}" stroke-width="1.5" style="cursor:move"
            onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'body')}"/>`;
          s+=`<text x="${svgX(midX)}" y="${svgY(midY)+4}" text-anchor="middle" font-size="10" fill="${c}" style="pointer-events:none">↕</text>`;
        }
      }
    }
  }

  if(type==='line'&&g.lines[idx]&&g.lines[idx].type==='fn'){
    const l=g.lines[idx]; const c=l.color||'#2563eb';
    const a=parseFloat(l.fnA)||1;
    const h=parseFloat(l.fnH)||0;
    const k=parseFloat(l.fnK)||0;
    const fn=parseFnExpr(l.fnExpr||'1/x');
    if(fn){
      // Find 3 sample points on the curve within view for handle placement
      const evalY=x=>{try{const y=a*fn(x-h)+k;return isFinite(y)?Math.max(g.yMin,Math.min(g.yMax,y)):null;}catch(e){return null;}};

      // Body drag handle — midpoint of visible curve
      const midX=(g.xMin+g.xMax)*0.5;
      const midY=evalY(midX);
      if(midY!==null){
        s+=`<rect x="${svgX(midX)-24}" y="${svgY(midY)-10}" width="48" height="20" rx="6" fill="${c}" fill-opacity="0.12" style="cursor:move"
          onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'fn_k')}"/>`;
        s+=`<text x="${svgX(midX)}" y="${svgY(midY)+4}" text-anchor="middle" font-size="10" fill="${c}" font-weight="500" style="pointer-events:none">↕ 이동</text>`;
      }

      // Left handle — x-shift (h parameter) — at 25% of x range
      const lx=g.xMin+(g.xMax-g.xMin)*0.2;
      const ly=evalY(lx);
      if(ly!==null&&ly>g.yMin&&ly<g.yMax){
        s+=`<circle cx="${svgX(lx)}" cy="${svgY(ly)}" r="${HIT}" fill="white" stroke="${c}" stroke-width="2" style="cursor:ew-resize"
          onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'fn_h')}"/>`;
        s+=`<text x="${svgX(lx)}" y="${svgY(ly)+3}" text-anchor="middle" font-size="8" fill="${c}" style="pointer-events:none">h</text>`;
      }

      // Right handle — scale (a parameter) — at 75% of x range
      const rx=g.xMin+(g.xMax-g.xMin)*0.75;
      const ry=evalY(rx);
      if(ry!==null&&ry>g.yMin&&ry<g.yMax){
        s+=`<circle cx="${svgX(rx)}" cy="${svgY(ry)}" r="${HIT}" fill="white" stroke="${c}" stroke-width="2" style="cursor:ns-resize"
          onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'fn_a')}"/>`;
        s+=`<text x="${svgX(rx)}" y="${svgY(ry)+3}" text-anchor="middle" font-size="8" fill="${c}" style="pointer-events:none">a</text>`;
      }

      // Shape handle — top area, controls main curvature parameter
      // For hyperbola/root: adjusts the "scale" of fnExpr numerically by changing fnA
      // Show as diamond at top-right
      const shapex=g.xMin+(g.xMax-g.xMin)*0.35;
      const shapey=evalY(shapex);
      if(shapey!==null&&shapey>g.yMin+0.5&&shapey<g.yMax-0.5){
        const sx=svgX(shapex), sy=svgY(shapey)-18;
        s+=`<polygon points="${sx},${sy-8} ${sx+8},${sy} ${sx},${sy+8} ${sx-8},${sy}" fill="white" stroke="${c}" stroke-width="2" style="cursor:ns-resize"
          onpointerdown="if(S.tool==='select'){event.stopPropagation();startDrag(event.clientX,event.clientY,'${g.id}','line',${idx},'fn_shape')}"/>`;
        s+=`<text x="${sx}" y="${sy+3}" text-anchor="middle" font-size="8" fill="${c}" font-weight="600" style="pointer-events:none">◆</text>`;
      }

      // Legend showing current params
      s+=`<text x="${drawXMin+4}" y="${drawYMax-4}" font-size="9" fill="${c}" opacity="0.8" style="pointer-events:none">a=${Math.round(a*10)/10} h=${Math.round(h*10)/10} k=${Math.round(k*10)/10}</text>`;
    }
  }

  if(type==='area'&&g.areas[idx]){
    const a=g.areas[idx];
    (a.pts||[]).forEach((p,pi)=>{
      s+=`<circle cx="${svgX(p.x)}" cy="${svgY(p.y)}" r="${HIT}" fill="white" stroke="${a.color||'#3b82f6'}" stroke-width="2" style="cursor:move"
        onpointerdown="if(S.tool==='select'){event.stopPropagation();startAreaVtx(event.clientX,event.clientY,'${g.id}',${idx},${pi})}"/>`;
    });
  }
  return s;
}

// ==================== SVG INTERACTION ====================
let _hoverSnap=null;

function svgMouseLeave(gid){
  if(_hoverSnap&&_hoverSnap.gid===gid){_hoverSnap=null;refreshSVG(gid);}
}

function getSVGCoords(clientX,clientY,gid){
  const g=GbyId(gid);if(!g)return null;
  const svg=document.getElementById('isvg-'+gid);if(!svg)return null;
  const rect=svg.getBoundingClientRect();
  // Must match renderSVG exactly — both derive from getCanvasDims(g)
  const {W,H,pad,rightMargin}=getCanvasDims(g);
  const scaleX=W/rect.width, scaleY=H/rect.height;
  const px=(clientX-rect.left)*scaleX;
  const py=(clientY-rect.top)*scaleY;
  const {xMin,xMax,yMin,yMax,coordType:ct}=g;
  let oy;
  if(ct==='q14') oy=H/2;
  else if(ct==='all') oy=H/2;
  else oy=H-pad+6;
  const drawXMin=pad, drawXMax=W-rightMargin, drawYMin=18, drawYMax=oy<H-10?H-pad+6:H-22;
  const x=xMin+(px-drawXMin)/(drawXMax-drawXMin)*(xMax-xMin);
  const y=yMin+(drawYMax-py)/(drawYMax-drawYMin)*(yMax-yMin);
  return {x,y};
}

function findSnapPoint(g,raw){
  const candidates=[];
  const step=g.tickStep||2;
  const gx=Math.round(raw.x/step)*step;
  const gy=Math.round(raw.y/step)*step;
  if(gx>=g.xMin&&gx<=g.xMax&&gy>=g.yMin&&gy<=g.yMax)
    candidates.push({x:gx,y:gy,type:'grid',dist:Math.hypot(raw.x-gx,raw.y-gy)});
  const lines=(g.lines||[]).map(toLineFn).filter(Boolean);
  for(let i=0;i<lines.length;i++) for(let j=i+1;j<lines.length;j++){
    const pt=lineIntersect(lines[i],lines[j]);
    if(pt&&pt.x>=g.xMin&&pt.x<=g.xMax&&pt.y>=g.yMin&&pt.y<=g.yMax)
      candidates.push({x:pt.x,y:pt.y,type:'intersection',dist:Math.hypot(raw.x-pt.x,raw.y-pt.y)});
  }
  lines.forEach(fn=>{
    const oy=fn.atX?fn.atX(0):null;
    if(oy!=null&&oy!=='any'&&oy>=g.yMin&&oy<=g.yMax)
      candidates.push({x:0,y:oy,type:'intersection',dist:Math.hypot(raw.x,raw.y-oy)});
    const ox=fn.atY?fn.atY(0):null;
    if(ox!=null&&ox!=='any'&&ox>=g.xMin&&ox<=g.xMax)
      candidates.push({x:ox,y:0,type:'intersection',dist:Math.hypot(raw.x-ox,raw.y)});
  });
  if(!candidates.length)return null;
  candidates.sort((a,b)=>a.dist-b.dist);
  const thr=Math.max(g.xMax-g.xMin,g.yMax-g.yMin)*0.045;
  return candidates[0].dist<=thr?candidates[0]:null;
}

function toLineFn(l){
  if(l.type==='line'){const m=l.slope||0,b=l.int||0;return{atX:x=>m*x+b,atY:y=>m===0?null:(y-b)/m};}
  if(l.type==='2pt'){
    const dx=l.x1-l.x0;if(Math.abs(dx)<1e-9)return{atX:()=>null,atY:()=>l.x0,vertical:l.x0};
    const m=(l.y1-l.y0)/dx,b=l.y0-m*l.x0;return{atX:x=>m*x+b,atY:y=>m===0?null:(y-b)/m};
  }
  if(l.type==='horiz')return{atX:()=>l.yv||0,atY:()=>null,horizontal:l.yv||0};
  if(l.type==='vert')return{atX:()=>null,atY:()=>l.xv||0,vertical:l.xv||0};
  return null;
}

function lineIntersect(f1,f2){
  if(f1.vertical!=null&&f2.vertical!=null)return null;
  if(f1.vertical!=null){const y=f2.atX&&f2.atX(f1.vertical);return y!=null&&y!=='any'?{x:f1.vertical,y}:null;}
  if(f2.vertical!=null){const y=f1.atX&&f1.atX(f2.vertical);return y!=null&&y!=='any'?{x:f2.vertical,y}:null;}
  if(f1.horizontal!=null){const x=f2.atY&&f2.atY(f1.horizontal);return x!=null&&x!=='any'?{x,y:f1.horizontal}:null;}
  if(f2.horizontal!=null){const x=f1.atY&&f1.atY(f2.horizontal);return x!=null&&x!=='any'?{x,y:f2.horizontal}:null;}
  try{const m1=f1.atX(1)-f1.atX(0),b1=f1.atX(0),m2=f2.atX(1)-f2.atX(0),b2=f2.atX(0);
    if(Math.abs(m1-m2)<1e-9)return null;const x=(b2-b1)/(m1-m2);return{x,y:m1*x+b1};}catch{return null;}
}

function roundCoord(v){return Math.round(v*10)/10}

function handlePointerMove(clientX,clientY,gid){
  if(S.tool==='select')return;
  const g=GbyId(gid);if(!g)return;
  const raw=getSVGCoords(clientX,clientY,gid);if(!raw)return;
  const snap=findSnapPoint(g,raw);
  const np={gid,point:snap?{x:snap.x,y:snap.y,snapped:true,kind:snap.type}:{x:roundCoord(raw.x),y:roundCoord(raw.y),snapped:false}};
  const prev=_hoverSnap;_hoverSnap=np;
  const chg=!prev||prev.gid!==gid||prev.point.snapped!==np.point.snapped
    ||Math.abs((prev.point.x||0)-(np.point.x||0))>0.05||Math.abs((prev.point.y||0)-(np.point.y||0))>0.05;
  if(chg)refreshSVG(gid);
}

function refreshSVG(gid){
  const g=GbyId(gid);if(!g)return;
  const wrap=document.getElementById('wrap-'+gid);if(!wrap)return;
  const {svg}=renderSVG(g,true);
  wrap.innerHTML=svg;
}

function commitPoint(gid){
  if(!_hoverSnap||_hoverSnap.gid!==gid)return null;
  const p=_hoverSnap.point;
  return{x:roundCoord(p.x),y:roundCoord(p.y)};
}

function handlePointerDown(clientX,clientY,gid){
  if(S.tool==='select')return;
  if(S.selectedId!==gid){S.selectedId=gid;}
  // Compute coords directly — do NOT call handlePointerMove here (it calls refreshSVG which replaces DOM)
  const raw=getSVGCoords(clientX,clientY,gid);
  if(!raw)return;
  const g=GbyId(gid);if(!g)return;
  // Try snap, fall back to raw
  const snap=findSnapPoint(g,raw);
  const coords=snap?{x:snap.x,y:snap.y}:{x:roundCoord(raw.x),y:roundCoord(raw.y)};

  if(S.tool==='point'){
    g.points.push({x:coords.x,y:coords.y,label:'',color:'#374151',dropLines:true});
    S.sel={gid,type:'point',idx:g.points.length-1};
    renderAll();
  } else if(S.tool==='line'){
    if(!S.drawState||S.drawState.gid!==gid){
      S.drawState={type:'line',gid,pts:[coords]};
      renderAll();
      showIndicator('두 번째 점을 클릭하여 선 완성');
      updateDrawActionsBar();
    } else {
      S.drawState.pts.push(coords);
      if(S.drawState.pts.length>=2){
        const [p0,p1]=S.drawState.pts;
        const l={name:'',eq:'',type:'2pt',x0:p0.x,y0:p0.y,x1:p1.x,y1:p1.y,color:COLORS[g.lines.length%COLORS.length],w:2,dashed:false};
        g.lines.push(l);
        S.sel={gid,type:'line',idx:g.lines.length-1};
        S.drawState=null;setTool('select');renderAll();
      }
    }
  } else if(S.tool==='area'){
    if(!S.drawState||S.drawState.gid!==gid){
      S.drawState={type:'area',gid,pts:[coords]};
      showIndicator('계속 클릭 → "면 완성" 버튼 (3점+)');
    } else {
      S.drawState.pts.push(coords);
    }
    renderAll();
    updateDrawActionsBar();
  }
}

function finishArea(){
  if(S.tool!=='area'||!S.drawState||S.drawState.pts.length<3)return;
  const g=GbyId(S.drawState.gid);if(!g)return;
  g.areas.push({label:'',pts:S.drawState.pts.slice(),color:'#3b82f6',hatch:false});
  S.sel={gid:S.drawState.gid,type:'area',idx:g.areas.length-1};
  const gid_=S.drawState.gid;S.drawState=null;setTool('select');renderAll();
}

function cancelDraw(){S.drawState=null;setTool('select');renderAll();}

// ---- Mouse events ----
function svgClick(event,gid){
  if(S.tool==='select'){
    if(!drag.active) hideCtxMenu();
    return;
  }
  // In draw mode, always capture click regardless of what child element was clicked
  event.stopPropagation();
  handlePointerDown(event.clientX,event.clientY,gid);
}
function svgMouseMove(event,gid){ handlePointerMove(event.clientX,event.clientY,gid); }
function svgDblClick(event,gid){ if(S.tool==='area') finishArea(); }

// ---- Touch events ----
function svgTouchStart(event,gid){
  if(S.tool==='select')return;
  event.preventDefault();
  const t=event.touches[0];if(!t)return;
  handlePointerDown(t.clientX,t.clientY,gid);
}
function svgTouchMove(event,gid){
  if(S.tool==='select')return;
  const t=event.touches[0];if(!t)return;
  event.preventDefault();
  handlePointerMove(t.clientX,t.clientY,gid);
}

// ---- Click on specific elements (only in select mode) ----
function elClick(event,gid,type,idx){
  if(S.tool!=='select') return; // draw tools ignore element clicks
  event.stopPropagation();
  S.selectedId=gid;S.sel={gid,type,idx};
  renderAll();
  showCtxMenu(gid,type,idx,event.clientX,event.clientY);
}

function openPreview(){
  // Render all graphs clean (no selection, no handles, non-interactive)
  const savedSel=S.sel;
  const savedTool=S.tool;
  S.sel=null; // temporarily clear selection so no handles render

  const n=S.graphs.length;
  const cols=n<=1?1:n<=2?2:3;
  const gridHtml=S.graphs.map(g=>{
    const {svg}=renderSVG(g,false); // non-interactive = no hit areas, no handles
    const eqs=(g.lines||[]).filter(l=>l.eq);
    const eqHtml=eqs.length
      ?`<div style="font-size:${n===1?'15px':n===2?'12px':'10px'};color:#555;margin-top:8px;border-top:1px solid #f0f0ec;padding-top:6px;display:flex;flex-direction:column;gap:4px">${eqs.map(l=>`<div style="display:flex;align-items:center;gap:7px"><span style="width:18px;height:3px;border-radius:2px;background:${l.color||'#2563eb'};flex-shrink:0;display:inline-block"></span><span><b style="color:${l.color||'#2563eb'}">${esc(l.name||'')}</b>${l.eq?' : '+esc(l.eq):''}</span></div>`).join('')}</div>`:'';
    return `<div style="background:#fff;border-radius:10px;padding:14px">
      ${g.title?`<div style="font-size:${n===1?'24px':n===2?'16px':'13px'};font-weight:600;margin-bottom:4px">${esc(g.title)}</div>`:''}
      ${g.desc?`<div style="font-size:${n===1?'15px':n===2?'12px':'10px'};color:#9ca3af;margin-bottom:6px">${esc(g.desc)}</div>`:''}
      <div>${svg}</div>
      ${eqHtml}
    </div>`;
  }).join('');

  S.sel=savedSel; // restore

  const header=S.gridTitle
    ?`<div style="margin-bottom:14px"><div style="font-size:20px;font-weight:600">${esc(S.gridTitle)}</div>${S.gridDesc?`<div style="font-size:13px;color:#9ca3af;margin-top:2px">${esc(S.gridDesc)}</div>`:''}</div>`:'';

  document.getElementById('modal-title').textContent='미리보기';
  document.getElementById('modal-body').innerHTML=`
    <div style="background:#f5f5f3;border-radius:10px;padding:16px;min-width:min(80vw,700px)">
      ${header}
      <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:14px">
        ${gridHtml}
      </div>
    </div>`;
  document.getElementById('modal-actions').innerHTML=`
    <button class="tb-btn" onclick="closeModal();exportAll('white')">⬇ PNG 저장</button>
    <button class="tb-btn primary" onclick="closeModal()">닫기</button>`;
  document.getElementById('modal-bg').classList.add('open');
}

function exportAll(bg){
  const el=document.getElementById('canvas-inner');
  const origT=el.style.transform;
  el.style.transform='scale(1)';
  // Temporarily remove selection highlights and card borders
  const selected=document.querySelectorAll('.graph-card.selected');
  selected.forEach(c=>c.classList.remove('selected'));
  const allCards=document.querySelectorAll('.graph-card');
  const origBorders=[];
  allCards.forEach((c,i)=>{origBorders[i]=c.style.border;c.style.border='none';c.style.boxShadow='none';});
  setTimeout(()=>{
    html2canvas(document.getElementById('graph-grid-container'),{backgroundColor:bg==='transparent'?null:'#ffffff',scale:2,useCORS:true}).then(c=>{
      el.style.transform=origT;
      selected.forEach(c=>c.classList.add('selected'));
      allCards.forEach((c,i)=>{c.style.border=origBorders[i];c.style.boxShadow='';});
      dl(c,S.gridTitle||'economics-graphs');
    }).catch(e=>{
      el.style.transform=origT;
      selected.forEach(c=>c.classList.add('selected'));
      allCards.forEach((c,i)=>{c.style.border=origBorders[i];c.style.boxShadow='';});
      alert('내보내기 실패: '+e.message);
    });
  },50);
}
function exportSingle(gid){
  const g=GbyId(gid);
  const idx=S.graphs.findIndex(g=>g.id===gid);
  const cards=document.querySelectorAll('.graph-card');
  const card=cards[idx];
  if(!card)return;
  // Remove border/selection for clean export
  const wasSelected=card.classList.contains('selected');
  card.classList.remove('selected');
  const origBorder=card.style.border;
  card.style.border='none';card.style.boxShadow='none';
  setTimeout(()=>{
    html2canvas(card,{backgroundColor:'#ffffff',scale:2,useCORS:true}).then(c=>{
      if(wasSelected)card.classList.add('selected');
      card.style.border=origBorder;card.style.boxShadow='';
      dl(c,g?.title||'graph');
    }).catch(e=>{
      if(wasSelected)card.classList.add('selected');
      card.style.border=origBorder;card.style.boxShadow='';
      alert('오류: '+e.message);
    });
  },30);
}
function dl(canvas,name){
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download=(name||'graph').replace(/\s+/g,'-')+'.png';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

// ==================== PANEL TOGGLE ====================
function toggleP(h){
  const b=h.nextElementSibling;
  const c=b.classList.toggle('collapsed');
  h.querySelector('.arr').style.transform=c?'rotate(-90deg)':'';
}

// ==================== MOBILE ====================
function isMobile(){return window.innerWidth<=780}

function mobileShow(which){
  if(!isMobile())return;
  document.getElementById('sidebar').classList.remove('mobile-show');
  document.getElementById('canvas-wrap').classList.remove('mobile-show');
  document.getElementById('rpanel').classList.remove('mobile-show');
  document.getElementById(which==='sidebar'?'sidebar':which==='rpanel'?'rpanel':'canvas-wrap').classList.add('mobile-show');
  ['mtab-list','mtab-canvas','mtab-props'].forEach(id=>document.getElementById(id).classList.remove('active'));
  const map={sidebar:'mtab-list',canvas:'mtab-canvas',rpanel:'mtab-props'};
  document.getElementById(map[which])?.classList.add('active');
}

function mobileSetTool(t){
  setTool(t);
  if(isMobile()) mobileShow('canvas');
  ['mtab-select','mtab-point','mtab-line','mtab-area'].forEach(id=>document.getElementById(id)?.classList.remove('active'));
  document.getElementById('mtab-'+t)?.classList.add('active');
}

// Auto-switch to canvas after graph add/select on mobile
const _origCreateGraph=createGraph;
createGraph=function(cfg){
  _origCreateGraph(cfg);
  if(isMobile()) mobileShow('canvas');
};

const _origSelectGraph=selectGraph;
selectGraph=function(id){
  _origSelectGraph(id);
  if(isMobile()) mobileShow('canvas');
};

function syncZoomLabelMobile(){
  const m=document.getElementById('zoom-label-m');
  if(m) m.textContent=document.getElementById('zoom-label').textContent;
}
const _origApplyZoom=applyZoom;
applyZoom=function(){_origApplyZoom();syncZoomLabelMobile();};

window.addEventListener('resize',()=>{
  if(!isMobile()){
    document.getElementById('sidebar').classList.remove('mobile-show');
    document.getElementById('canvas-wrap').classList.remove('mobile-show');
    document.getElementById('rpanel').classList.remove('mobile-show');
  } else {
    mobileShow('canvas');
  }
});
if(isMobile()) mobileShow('canvas');

// ==================== INIT ====================
setTool('select');
renderAll();
</script>
