<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>경제학 그래프 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:13px;background:#f0f0ec;color:#1a1a18;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
/* TOOLBAR */
#toolbar{display:flex;align-items:center;gap:5px;padding:5px 10px;background:#fff;border-bottom:1px solid #ddd;flex-shrink:0;flex-wrap:wrap;z-index:10}
.tb-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;color:#1a1a18;white-space:nowrap;font-family:inherit}
.tb-btn:hover{background:#f0f0ec}.tb-btn.active{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}
.tb-btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.tb-btn.primary:hover{background:#1d4ed8}
.tb-sep{width:1px;height:20px;background:#e5e5e3;margin:0 2px;flex-shrink:0}
.tb-label{font-size:11px;color:#9ca3af;font-weight:600}
/* MAIN LAYOUT */
#main{display:flex;flex:1;overflow:hidden}
/* LEFT SIDEBAR */
#sidebar{width:220px;flex-shrink:0;background:#f8f8f6;border-right:1px solid #ddd;overflow-y:auto;display:flex;flex-direction:column}
/* CENTER CANVAS */
#canvas-wrap{flex:1;overflow:hidden;position:relative;background:#e8e8e4;cursor:default}
#canvas-scroll{width:100%;height:100%;overflow:auto}
#canvas-inner{position:relative;transform-origin:0 0;transition:transform 0.1s}
#graph-grid-container{padding:20px;display:inline-block;min-width:100%}
#grid-title-area{margin-bottom:14px;display:none}
#graph-grid{display:grid;gap:16px}
/* RIGHT PANEL */
#rpanel{width:260px;flex-shrink:0;background:#fff;border-left:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden}
#rpanel-header{padding:8px 12px;background:#f8f8f6;border-bottom:1px solid #ddd;font-weight:500;font-size:12px;color:#555;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#rpanel-body{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
/* GRAPH CARDS */
.graph-card{background:#fff;border:2px solid #e5e5e3;border-radius:10px;padding:10px 10px 8px 10px;position:relative;cursor:pointer;transition:border-color .15s}
.graph-card.selected{border-color:#3b82f6;box-shadow:0 0 0 3px #dbeafe}
.graph-card .card-title{font-size:26px;font-weight:600;margin-bottom:5px;color:#1a1a18}
.graph-card .card-desc{font-size:17px;color:#9ca3af;margin-bottom:8px}
.graph-card .card-top-btns{position:absolute;top:7px;right:7px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.graph-card:hover .card-top-btns{opacity:1}
.cbtn{padding:2px 7px;border:1px solid #d1d5db;border-radius:4px;background:#fff;cursor:pointer;font-size:10px;font-family:inherit}
.cbtn:hover{background:#f0f0ec}.cbtn.danger:hover{color:#dc2626}
/* SVG CANVAS */
.graph-svg-wrap{position:relative;display:block}
.graph-svg-wrap svg{display:block}
.eq-list{font-size:17px;color:#555;margin-top:10px;border-top:1px solid #f0f0ec;padding-top:8px;display:flex;flex-direction:column;gap:5px}
.eq-item{display:flex;align-items:center;gap:8px}
.eq-dot{width:22px;height:3px;border-radius:2px;flex-shrink:0}
/* Compact: 2 graphs */
.graph-card.compact .card-title{font-size:16px;margin-bottom:3px}
.graph-card.compact .card-desc{font-size:13px;margin-bottom:5px}
.graph-card.compact .eq-list{font-size:13px;gap:3px;margin-top:6px;padding-top:6px}
.graph-card.compact .eq-dot{width:16px;height:2.5px}
/* Compact3: 3+ graphs */
.graph-card.compact3 .card-title{font-size:13px;margin-bottom:2px}
.graph-card.compact3 .card-desc{font-size:11px;margin-bottom:4px}
.graph-card.compact3 .eq-list{font-size:11px;gap:2px;margin-top:5px;padding-top:5px}
.graph-card.compact3 .eq-dot{width:13px;height:2px}
/* SIDEBAR */
.panel{border-bottom:1px solid #e5e5e3}
.ph{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;cursor:pointer;font-size:11px;font-weight:500;color:#555}
.ph:hover{background:#f0f0ec}.ph .arr{transition:transform .2s}
.pb{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.pb.collapsed{display:none}
.graph-item{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:11px}
.graph-item:hover{background:#f0f0ec}.graph-item.active{background:#dbeafe;color:#1d4ed8}
.gi-del{margin-left:auto;opacity:0;color:#9ca3af;font-size:13px}
.graph-item:hover .gi-del{opacity:1}
.gi-color{width:9px;height:9px;border-radius:50%;flex-shrink:0}
/* FORM */
label{font-size:11px;color:#555;display:block;margin-bottom:2px}
input[type=text],input[type=number],select,textarea{width:100%;padding:4px 7px;border:1px solid #d1d5db;border-radius:5px;background:#fff;color:#1a1a18;font-size:12px;font-family:inherit;outline:none}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:#3b82f6}
input[type=range]{width:100%;accent-color:#2563eb}
input[type=color]{width:36px;height:26px;border:1px solid #d1d5db;border-radius:5px;cursor:pointer;padding:2px}
.row{display:flex;gap:6px;align-items:center}
.col{display:flex;flex-direction:column;gap:2px;flex:1}
.chk{display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer}
.chk input{width:auto}
/* RIGHT PANEL ITEMS */
.rp-item{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;border:1px solid #f0f0ec;cursor:pointer}
.rp-item:hover{background:#f8f8f6}.rp-item.active{background:#eff6ff;border-color:#93c5fd}
.rp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rp-name{flex:1;font-size:11px}
.rp-del{color:#d1d5db;font-size:13px;cursor:pointer}.rp-del:hover{color:#dc2626}
.rp-section{font-size:10px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-top:6px;margin-bottom:3px}
/* PROP FIELDS */
.pf-group{display:flex;flex-direction:column;gap:6px;padding:8px;background:#f8f8f6;border-radius:8px;border:1px solid #f0f0ec}
.pf-title{font-size:11px;font-weight:500;color:#1a1a18;margin-bottom:4px}
/* MODAL */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:200}
#modal-bg.open{display:flex}
#modal{background:#fff;border-radius:12px;padding:20px;min-width:340px;max-width:90vw;max-height:90vh;overflow-y:auto;border:1px solid #ddd;box-shadow:0 8px 32px rgba(0,0,0,.14)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid #f0f0ec}
.form-group{margin-bottom:10px}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}
.pi{padding:8px;border:1px solid #d1d5db;border-radius:7px;cursor:pointer;font-size:11px}
.pi:hover{border-color:#93c5fd;background:#f0f7ff}
.pi.sel{border-color:#2563eb;background:#eff6ff}
.pi-name{font-weight:500;margin-bottom:1px}
.pi-desc{font-size:9px;color:#9ca3af}
/* TOOL INDICATOR */
#tool-indicator{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:5px 14px;border-radius:20px;font-size:11px;pointer-events:none;display:none;z-index:5}
/* CROSSHAIR cursor for draw modes */
.draw-mode{cursor:crosshair!important}

/* ==================== MOBILE LAYOUT ==================== */
#mobile-tabbar{display:none;flex-shrink:0;background:#fff;border-top:1px solid #ddd;padding:4px 6px env(safe-area-inset-bottom,4px);z-index:20}
#mobile-tabbar .mt-row{display:flex;gap:4px}
.mt-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;color:#9ca3af}
.mt-btn.active{color:#1d4ed8;background:#eff6ff}
.mt-btn .mt-icon{font-size:18px;line-height:1}
.mt-btn .mt-label{font-size:9px}

#mobile-toolbar{display:none}

@media (max-width:780px){
  body{overflow:hidden}
  #toolbar{display:none}
  #mobile-toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#fff;border-bottom:1px solid #ddd;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #mobile-toolbar .tb-label{flex-shrink:0}
  #mobile-toolbar .tb-btn{flex-shrink:0;padding:5px 9px;font-size:11px}
  #mobile-toolbar .tb-sep{flex-shrink:0}

  #main{flex-direction:column}
  #sidebar{display:none;width:100%;height:100%;position:absolute;inset:0;z-index:15;border-right:none}
  #sidebar.mobile-show{display:flex}
  #canvas-wrap{display:none;width:100%;flex:1}
  #canvas-wrap.mobile-show{display:block}
  #rpanel{display:none;width:100%;height:100%;position:absolute;inset:0;z-index:15;border-left:none}
  #rpanel.mobile-show{display:flex}

  #mobile-tabbar{display:block}
  #sidebar-mobile-header{display:flex!important}
  #rpanel-mobile-close{display:inline-flex!important}

  .graph-card{padding:8px}
  #graph-grid{gap:10px!important;grid-template-columns:1fr!important}
  #graph-grid-container{padding:10px}
  .graph-svg-wrap svg{width:100%;height:auto;max-width:340px}

  #modal{min-width:0;width:92vw;padding:16px}
  .preset-grid{grid-template-columns:1fr 1fr}

  #tool-indicator{font-size:10px;bottom:6px}

  /* Bigger touch targets on mobile */
  .tb-btn{padding:7px 12px}
  .rp-item{padding:8px}
  .cbtn{padding:5px 9px;font-size:11px}
  .card-top-btns{opacity:1}
}
</style>
</head>
<body>
<div id="toolbar">
  <span class="tb-label">📈 경제학 그래프 생성기</span>
  <div class="tb-sep"></div>
  <button class="tb-btn primary" onclick="openAddGraph()">+ 그래프 추가</button>
  <button class="tb-btn" onclick="openGridTitle()">📋 그리드 제목</button>
  <button class="tb-btn" onclick="openManagePresets()">⭐ 프리셋 관리</button>
  <div class="tb-sep"></div>
  <span class="tb-label">줌</span>
  <button class="tb-btn" onclick="zoom(-0.1)">−</button>
  <span id="zoom-label" style="font-size:11px;min-width:32px;text-align:center">100%</span>
  <button class="tb-btn" onclick="zoom(0.1)">+</button>
  <button class="tb-btn" onclick="resetZoom()">리셋</button>
  <div class="tb-sep"></div>
  <span class="tb-label">그리드 배치</span>
  <button class="tb-btn" onclick="setLayout('auto')">자동</button>
  <button class="tb-btn" onclick="setLayout('1')">1열</button>
  <button class="tb-btn" onclick="setLayout('2')">2열</button>
  <button class="tb-btn" onclick="setLayout('3')">3열</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="openPreview()" style="font-weight:500">👁 미리보기</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="exportAll('white')">⬇ PNG</button>
  <button class="tb-btn" onclick="exportAll('transparent')">⬇ 투명</button>
  <span id="tb-status" style="font-size:10px;color:#9ca3af">그래프 없음</span>
</div>

<div id="mobile-toolbar">
  <span class="tb-label">📈 그래프</span>
  <div class="tb-sep"></div>
  <button class="tb-btn primary" onclick="openAddGraph()">+ 추가</button>
  <button class="tb-btn" onclick="openGridTitle()">제목</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="zoom(-0.1)">−</button>
  <span id="zoom-label-m" style="font-size:11px;min-width:30px;text-align:center">100%</span>
  <button class="tb-btn" onclick="zoom(0.1)">+</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="openPreview()" style="font-weight:500">👁 미리보기</button>
  <button class="tb-btn" onclick="exportAll('white')">⬇ PNG</button>
  <button class="tb-btn" onclick="exportAll('transparent')">⬇ 투명</button>
</div>

<div id="main">
  <!-- LEFT SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-mobile-header" style="display:none;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #ddd;flex-shrink:0">
      <span style="font-weight:600;font-size:13px">그래프 목록 / 설정</span>
      <button class="tb-btn" onclick="mobileShow('canvas')">✕ 닫기</button>
    </div>
    <div class="panel">
      <div class="ph" onclick="toggleP(this)"><span>그래프 목록</span><span class="arr">▾</span></div>
      <div class="pb" id="graph-list"></div>
    </div>
    <div class="panel">
      <div class="ph" onclick="toggleP(this)"><span>도구</span><span class="arr">▾</span></div>
      <div class="pb">
        <button class="tb-btn" id="tool-select-btn" onclick="setTool('select')" style="width:100%;justify-content:center">🖱 선택 / 이동</button>
        <div style="height:4px"></div>
        <div style="font-size:10px;font-weight:600;color:#9ca3af;margin-bottom:3px">직접 그리기</div>
        <button class="tb-btn" id="tool-point-btn" onclick="setTool('point')" style="width:100%;justify-content:center">🔵 점 찍기</button>
        <button class="tb-btn" id="tool-line-btn" onclick="setTool('line')" style="width:100%;justify-content:center">📏 두 점으로 선 긋기</button>
        <button class="tb-btn" id="tool-area-btn" onclick="setTool('area')" style="width:100%;justify-content:center">🎨 면 그리기</button>
        <div style="height:4px"></div>
        <div style="font-size:10px;font-weight:600;color:#9ca3af;margin-bottom:3px">함수로 추가</div>
        <button class="tb-btn" id="tool-fn-btn" onclick="openFnDialog()" style="width:100%;justify-content:center;background:#eff6ff;border-color:#93c5fd;color:#1d4ed8">𝑓 함수식으로 선 추가</button>
        <button class="tb-btn" onclick="openLineParamDialog()" style="width:100%;justify-content:center">⊞ 기울기/절편으로 추가</button>
        <div style="font-size:10px;color:#9ca3af;line-height:1.6;margin-top:4px">
          • 점: 그래프 위 클릭<br>
          • 선: 시작점 → 끝점 클릭<br>
          • 면: 꼭짓점 클릭 → 완성 버튼<br>
          • 함수식: y=f(x) 직접 입력
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="ph" onclick="toggleP(this)"><span>좌표계 설정</span><span class="arr">▾</span></div>
      <div class="pb" id="coord-panel">
        <div style="font-size:10px;color:#9ca3af">그래프를 선택하세요</div>
      </div>
    </div>
  </div>

  <!-- CENTER CANVAS -->
  <div id="canvas-wrap">
    <div id="canvas-scroll">
      <div id="canvas-inner">
        <div id="graph-grid-container">
          <div id="grid-title-area">
            <div id="grid-title-text" style="font-size:18px;font-weight:600"></div>
            <div id="grid-desc-text" style="font-size:12px;color:#9ca3af;margin-top:2px"></div>
          </div>
          <div id="graph-grid"></div>
          <div id="empty-state" style="padding:60px;text-align:center;color:#9ca3af">
            <div style="font-size:36px;margin-bottom:12px">📈</div>
            <div style="font-size:14px;font-weight:500;margin-bottom:4px;color:#555">그래프를 추가하세요</div>
            <div style="font-size:11px">"그래프 추가" 버튼으로 시작</div>
          </div>
        </div>
      </div>
    </div>
    <div id="tool-indicator"></div>
    <div id="draw-actions" style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:none;gap:6px;z-index:6;align-items:center"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="rpanel">
    <div id="rpanel-header">
      <span id="rpanel-title">속성</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span id="rpanel-close" style="cursor:pointer;color:#9ca3af;font-size:14px;display:none" onclick="clearRPanel()">✕</span>
        <button class="tb-btn" id="rpanel-mobile-close" style="display:none" onclick="mobileShow('canvas')">✕ 닫기</button>
      </span>
    </div>
    <div id="rpanel-body">
      <div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">그래프를 선택하거나<br>요소를 클릭하세요</div>
    </div>
  </div>
</div>

<div id="mobile-tabbar">
  <div class="mt-row">
    <button class="mt-btn" id="mtab-list" onclick="mobileShow('sidebar')">
      <span class="mt-icon">📋</span><span class="mt-label">목록</span>
    </button>
    <button class="mt-btn active" id="mtab-canvas" onclick="mobileShow('canvas')">
      <span class="mt-icon">📈</span><span class="mt-label">그래프</span>
    </button>
    <button class="mt-btn" id="mtab-select" onclick="mobileSetTool('select')">
      <span class="mt-icon">🖱</span><span class="mt-label">선택</span>
    </button>
    <button class="mt-btn" id="mtab-point" onclick="mobileSetTool('point')">
      <span class="mt-icon">🔵</span><span class="mt-label">점</span>
    </button>
    <button class="mt-btn" id="mtab-line" onclick="mobileSetTool('line')">
      <span class="mt-icon">📏</span><span class="mt-label">선</span>
    </button>
    <button class="mt-btn" id="mtab-area" onclick="mobileSetTool('area')">
      <span class="mt-icon">🎨</span><span class="mt-label">면</span>
    </button>
    <button class="mt-btn" id="mtab-props" onclick="mobileShow('rpanel')">
      <span class="mt-icon">⚙️</span><span class="mt-label">속성</span>
    </button>
  </div>
</div>

<div id="modal-bg">
  <div id="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
// ==================== STATE ====================
const S = {
  graphs: [], selectedId: null,
  gridTitle:'', gridDesc:'',
  nextId:1, zoom:1, layout:'auto',
  tool:'select',
  drawState: null // {type:'line'|'area', points:[{x,y}], gid}
};
const COLORS=['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#b45309'];
let PRESETS=[
  {id:'sd',name:'수요·공급',desc:'수요/공급 곡선',xl:'Q',yl:'P',lines:[
    {name:'D',eq:'P = -Q + 10',color:'#2563eb',type:'line',slope:-1,int:10,w:2},
    {name:'S',eq:'P = Q + 2',color:'#dc2626',type:'line',slope:1,int:2,w:2}]},
  {id:'ppc',name:'PPC',desc:'생산가능곡선',xl:'X재',yl:'Y재',lines:[
    {name:'PPC',eq:'',color:'#16a34a',type:'curve',curv:1.5,int:9,w:2}]},
  {id:'ic',name:'무차별곡선',desc:'소비자이론',xl:'X재',yl:'Y재',lines:[
    {name:'IC₁',eq:'U₁=XY',color:'#7c3aed',type:'curve',curv:1.5,int:9,w:2},
    {name:'IC₂',eq:'U₂=XY',color:'#a78bfa',type:'curve',curv:1.5,int:6,w:2},
    {name:'예산선',eq:'PₓX+PᵧY=I',color:'#dc2626',type:'line',slope:-1,int:8,w:2}]},
  {id:'mono',name:'독점',desc:'독점 이윤극대화',xl:'Q',yl:'P,C',lines:[
    {name:'AR(D)',eq:'P=12-Q',color:'#2563eb',type:'line',slope:-1,int:12,w:2},
    {name:'MR',eq:'MR=12-2Q',color:'#0891b2',type:'line',slope:-2,int:12,dashed:true,w:2},
    {name:'MC',eq:'MC=2',color:'#dc2626',type:'horiz',yv:2,w:2},
    {name:'AC',eq:'AC=6/Q+2',color:'#d97706',type:'curve',curv:1,int:6,w:2}]},
  {id:'iq',name:'등량곡선',desc:'생산자이론',xl:'L',yl:'K',lines:[
    {name:'Q₁',eq:'K=100/L',color:'#7c3aed',type:'curve',curv:1.5,int:9,w:2},

  {id:'islm',name:'IS-LM',desc:'거시경제',xl:'Y',yl:'r',lines:[

const BUILTIN_PRESET_IDS=new Set(['sd','ppc','ic','mono','iq','islm','ad','blank']);

function loadUserPresets(){
  try{
    const saved=localStorage.getItem('econ_all_presets');
    if(saved){
      const {presets,deletedBuiltins}=JSON.parse(saved);
      // Remove deleted builtins
      if(deletedBuiltins) deletedBuiltins.forEach(id=>{
        PRESETS=PRESETS.filter(p=>p.id!==id);
        BUILTIN_PRESET_IDS.delete(id);
      });
      // Apply name/desc changes to remaining builtins
      if(presets) presets.filter(p=>BUILTIN_PRESET_IDS.has(p.id)).forEach(saved=>{
        const p=PRESETS.find(p=>p.id===saved.id);
        if(p){p.name=saved.name;p.desc=saved.desc;}
      });
      // Add user presets
      if(presets) presets.filter(p=>!BUILTIN_PRESET_IDS.has(p.id)).forEach(p=>{
        if(p.id&&p.name) PRESETS.push(p);
      });
    }
  }catch(e){}
}

function saveUserPresets(){
  try{
    const deletedBuiltins=[...BUILTIN_PRESET_IDS].filter(id=>!PRESETS.find(p=>p.id===id));
    // Save all presets (builtins with possible name changes + user presets)
    localStorage.setItem('econ_all_presets',JSON.stringify({
      presets:PRESETS.map(p=>({id:p.id,name:p.name,desc:p.desc,xl:p.xl,yl:p.yl,ct:p.ct,
        xMin:p.xMin,xMax:p.xMax,yMin:p.yMin,yMax:p.yMax,tickStep:p.tickStep,
        showGrid:p.showGrid,showTicks:p.showTicks,showOrigin:p.showOrigin,
        canvasAuto:p.canvasAuto,canvasW:p.canvasW,canvasH:p.canvasH,
        lines:p.lines,points:p.points,areas:p.areas,isUser:p.isUser})),
      deletedBuiltins
    }));
  }catch(e){}
}

// ==================== SAFE MATH EXPRESSION PARSER ====================
// Converts expression string into a JS function f(x) safely (no eval of arbitrary code)
function parseFnExpr(expr){
  try{
    // Normalize input
    let e=expr.trim()
      .replace(/\s+/g,'')
      .replace(/\^/g,'**')           // x^2 → x**2
      .replace(/sqrt\(/g,'Math.sqrt(')
      .replace(/cbrt\(/g,'Math.cbrt(')
      .replace(/abs\(/g,'Math.abs(')
      .replace(/ln\(/g,'Math.log(')
      .replace(/log\(/g,'Math.log10(')
      .replace(/sin\(/g,'Math.sin(')
      .replace(/cos\(/g,'Math.cos(')
      .replace(/exp\(/g,'Math.exp(')
      .replace(/pi/gi,'Math.PI')
      .replace(/e(?![x\d])/g,'Math.E') // 'e' alone → Math.E
      .replace(/(\d)(x)/g,'$1*$2')    // 2x → 2*x
      .replace(/(\d)\(/g,'$1*(')      // 2( → 2*(
      // Block dangerous patterns
      ;
    // Security: only allow math chars + x
    if(/[a-zA-Z]/.test(e.replace(/Math\.(sqrt|cbrt|abs|log|log10|sin|cos|exp|PI|E)\b/g,'').replace(/x/g,'')))
      return null;
    // eslint-disable-next-line no-new-func
    const fn=new Function('x', `"use strict"; try{ return (${e}); } catch(e){ return NaN; }`);
    // Quick test
    const test=fn(1);
    if(typeof test!=='number') return null;
    return fn;
  }catch(e){ return null; }
}

function GbyId(id){return S.graphs.find(g=>g.id===id)}

// ==================== CANVAS SIZE (auto-fit / manual resize) ====================
// v1.1 — Each graph's SVG "canvas" (viewBox W/H) can either:
//   - auto-fit (g.canvasAuto !== false, default): W grows to fit the X/Y axis
//     label text so long labels are never clipped.
//   - manual (g.canvasAuto === false): uses g.canvasW / g.canvasH exactly as
//     the user set them via the size inputs in the sidebar / right panel.
// IMPORTANT: renderSVG(), getSVGCoords(), and drawSelectionHandles() must all
// derive W/H/pad from getCanvasDims(g) — never hardcode them again — or click
// / drag coordinates will drift out of sync with what's drawn.
let _measureCtx=null;
function measureTextWidth(text,fontPx,weight){
  if(!_measureCtx) _measureCtx=document.createElement('canvas').getContext('2d');
  _measureCtx.font=`${weight||400} ${fontPx}px system-ui,-apple-system,sans-serif`;
  return _measureCtx.measureText(String(text==null?'':text)).width;
}
function getCanvasDims(g){
  const pad=46, baseMinPlotW=252; // 252 = original baseline plot box width (320-22-46)
  // rightMargin = horizontal space reserved after the plot area for the X-axis
  // label text. This is the ONLY place that decides that margin — renderSVG(),
  // getSVGCoords() and drawSelectionHandles() all read it back from here (via
  // the returned value) instead of hardcoding "22", so the label always has
  // exactly as much room as it needs and is never clipped.
  const xLabelW=measureTextWidth(g.xLabel||'X',13,700);
  const yLabelW=measureTextWidth(g.yLabel||'Y',13,700);
  let rightMargin=Math.max(22,Math.ceil(xLabelW)+16);

  if(g.canvasAuto===false){
    const W=Math.max(150,Math.round(g.canvasW)||320);
    const H=Math.max(120,Math.round(g.canvasH)||260);
    // Manual size: still avoid an absurd margin that would invert the box,
    // but otherwise respect the user's chosen (possibly non-square) W/H.
    rightMargin=Math.max(22,Math.min(rightMargin,W-pad-30));
    return {W,H,pad,rightMargin};
  }

  // Auto mode. Start from the baseline plot width, then grow it if the
  // Y-axis label (drawn just to the right of the x=0 line) would otherwise
  // run past the box's right edge. fracX is where x=0 sits along the plot
  // width (0 = left edge, e.g. q1; further right for coord types whose xMin<0).
  const xSpan=(g.xMax-g.xMin)||1;
  const fracX=Math.min(0.98,Math.max(0,(0-g.xMin)/xSpan));
  let plotW=baseMinPlotW;
  const neededPlotW=(yLabelW+12)/Math.max(0.02,1-fracX);
  if(neededPlotW>plotW) plotW=Math.ceil(neededPlotW);

  const W=pad+plotW+rightMargin;
  // Keep the plotted box itself square (equal X-axis/Y-axis pixel length)
  // regardless of how wide the card ends up — H is derived from the final
  // plot width, not a fixed constant, so long labels never distort the box.
  const H=Math.ceil(plotW+pad+12);
  g.canvasW=W; g.canvasH=H; // keep in sync so UI/export/presets can read the current size
  return {W,H,pad,rightMargin};
}
function getMinColWidth(){
  if(!S.graphs.length) return 280;
  return Math.max(280,...S.graphs.map(g=>getCanvasDims(g).W));
}

// ==================== LABEL LAYOUT (collision avoidance) ====================
// Used by renderSVG() to keep line/point/area name labels — and the axis
// titles / origin "O" they're most likely to collide with — from overlapping.
// `movable` labels get nudged (mostly vertically); `fixed` labels (axis
// titles, origin) never move but still push movable ones out of the way.
function resolveLabelOverlaps(movable,fixed){
  const meas=l=>{
    const w=measureTextWidth(l.text,l.fontSize||12,l.fontWeight||600)+4;
    const h=(l.fontSize||12)+5;
    const x0=l.anchor==='middle'?l.x-w/2:l.anchor==='end'?l.x-w:l.x;
    return {w,h,x0};
  };
  const mv=movable.map(l=>({...l,...meas(l)}));
  const fx=(fixed||[]).map(l=>({...l,...meas(l)}));
  const overlaps=(a,b)=>a.x0<b.x0+b.w&&b.x0<a.x0+a.w&&Math.abs(a.y-b.y)<(a.h+b.h)/2;
  for(let iter=0;iter<8;iter++){
    let moved=false;
    for(let i=0;i<mv.length;i++){
      for(let j=0;j<fx.length;j++){
        const a=mv[i],b=fx[j];
        if(overlaps(a,b)){
          const need=(a.h+b.h)/2-Math.abs(a.y-b.y)+2;
          a.y+=(a.y<=b.y?-need:need);
          moved=true;
        }
      }
      for(let j=i+1;j<mv.length;j++){
        const a=mv[i],b=mv[j];
        if(overlaps(a,b)){
          const need=((a.h+b.h)/2-Math.abs(a.y-b.y))/2+1;
          if(a.y<=b.y){a.y-=need;b.y+=need;}else{a.y+=need;b.y-=need;}
          moved=true;
        }
      }
    }
    if(!moved)break;
  }
  return mv;
}
function setCanvasAuto(gid,val){
  const g=GbyId(gid);if(!g)return;

// ==================== GRAPH CREATION ====================
function createGraph(cfg){
  const id='g'+(S.nextId++);
  const pre=PRESETS.find(p=>p.id===cfg.pid)||PRESETS.find(p=>p.id==='blank')||PRESETS[PRESETS.length-1];
  const isUser=!!pre.isUser;
  const g={
    id,
    // NOTE: !==undefined (not ||) so an intentionally-blank title/desc/label
    // from the "그래프 추가" dialog is respected instead of reverting to the
    // preset's default text (this was a bug — see HANDOFF.md).
    title:cfg.title!==undefined?cfg.title:pre.name,
    desc:cfg.desc!==undefined?cfg.desc:(pre.desc||''),
    coordType:cfg.ct||(isUser?pre.ct:null)||'q1',
    xLabel:cfg.xl!==undefined?cfg.xl:(pre.xl||'Q'),
    yLabel:cfg.yl!==undefined?cfg.yl:(pre.yl||'P'),
    showOrigin:isUser&&pre.showOrigin!==undefined?pre.showOrigin:true,
    showGrid:isUser&&pre.showGrid!==undefined?pre.showGrid:true,
    showTicks:isUser&&pre.showTicks!==undefined?pre.showTicks:true,
    xMin:isUser&&pre.xMin!==undefined?pre.xMin:0,
    xMax:isUser&&pre.xMax!==undefined?pre.xMax:10,
    yMin:isUser&&pre.yMin!==undefined?pre.yMin:0,
    yMax:isUser&&pre.yMax!==undefined?pre.yMax:10,
    tickStep:isUser&&pre.tickStep?pre.tickStep:2,
    canvasAuto:isUser&&pre.canvasAuto===false?false:true,
    canvasW:isUser&&pre.canvasW?pre.canvasW:undefined,
    canvasH:isUser&&pre.canvasH?pre.canvasH:undefined,
    lines:JSON.parse(JSON.stringify(pre.lines||[])),
    points:JSON.parse(JSON.stringify(pre.points||[])),
    areas:JSON.parse(JSON.stringify(pre.areas||[]))
  };
  // Adjust coordinate bounds for non-user presets based on coordType
  if(!isUser){
    if(g.coordType==='q14'){g.yMin=-5;}
    if(g.coordType==='all'){g.xMin=-6;g.yMin=-6;}
  }
  S.graphs.push(g);
  S.selectedId=id;
  renderAll();renderCoordPanel();renderRPanel(null);
}

// ==================== RENDER SVG ====================
function renderSVG(g,interactive){
  const {W,H,pad,rightMargin}=getCanvasDims(g);
  const {xMin,xMax,yMin,yMax,coordType:ct,showGrid:sg,showTicks:st,tickStep:ts}=g;
  const xRange=xMax-xMin,yRange=yMax-yMin;
  // Origin SVG position
  let ox,oy;
  if(ct==='q1'||ct==='q1_no'||!ct){ox=pad;oy=H-pad+6;}
  else if(ct==='q14'){ox=pad;oy=H/2;}
  else{ox=W/2;oy=H/2;}
  // Draw area — right margin sized to fit the X-axis label exactly (getCanvasDims)
  const drawXMin=pad, drawXMax=W-rightMargin, drawYMin=18, drawYMax=oy<H-10?H-pad+6:H-22;

  const svgX=x=>drawXMin+(x-xMin)/xRange*(drawXMax-drawXMin);
  const svgY=y=>drawYMax-(y-yMin)/yRange*(drawYMax-drawYMin);

  // SVG is responsive: width="100%" with an auto-fit/resizable viewBox (see getCanvasDims()).
  // overflow:visible is intentional so a long label that still pokes past the
  // viewBox is never hard-clipped — getCanvasDims() also grows the viewBox to
  // fit it in the first place, this is just a safety net.
  // (previously this tag had TWO "style" attributes when interactive; only the
  // first is honored by the HTML parser, so touch-action:none was silently
  // ignored — merged into one attribute below.)
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible${interactive?';touch-action:none':''}"`;
  if(interactive) s+=` id="isvg-${g.id}" data-gid="${g.id}" onclick="svgClick(event,'${g.id}')" ondblclick="svgDblClick(event,'${g.id}')" onmousemove="svgMouseMove(event,'${g.id}')" onmouseleave="svgMouseLeave('${g.id}')" ontouchstart="svgTouchStart(event,'${g.id}')" ontouchmove="svgTouchMove(event,'${g.id}')"`;
  s+=`>`;

  // Grid
  if(sg){
    s+=`<g stroke="#f0f0ec" stroke-width="1">`;
    const step=ts||2;
    for(let v=Math.ceil(xMin/step)*step;v<=xMax;v+=step){
      s+=`<line x1="${svgX(v)}" y1="${drawYMin}" x2="${svgX(v)}" y2="${drawYMax}"/>`;
    }
    for(let v=Math.ceil(yMin/step)*step;v<=yMax;v+=step){
      s+=`<line x1="${drawXMin}" y1="${svgY(v)}" x2="${drawXMax}" y2="${svgY(v)}"/>`;
    }
    s+=`</g>`;
  }

  // Label candidates from areas/lines/points are collected here instead of
  // being written straight into `s`, then de-overlapped as a batch and drawn
  // on top of every shape at the end (see resolveLabelOverlaps()).
  const labelQueue=[];

  // Areas
  (g.areas||[]).forEach(a=>{
    if(!a.pts||a.pts.length<3)return;
    const pts=a.pts.map(p=>`${svgX(p.x)},${svgY(p.y)}`).join(' ');
    const fc=a.color||'#3b82f6';
    if(a.hatch){
      const pid='hp'+Math.random().toString(36).slice(2,7);
      s+=`<defs><pattern id="${pid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fc}" stroke-width="1.5"/></pattern></defs>`;
      s+=`<polygon points="${pts}" fill="url(#${pid})" opacity=".7" stroke="${fc}" stroke-width="1.2"/>`;
    } else {
      s+=`<polygon points="${pts}" fill="${fc}" fill-opacity=".18" stroke="${fc}" stroke-width="1.2"/>`;
    }
    if(a.label){
      const cx=a.pts.reduce((acc,p)=>acc+p.x,0)/a.pts.length;
      const cy=a.pts.reduce((acc,p)=>acc+p.y,0)/a.pts.length;
      labelQueue.push({x:svgX(cx),y:svgY(cy)+4,text:a.label,color:fc,fontSize:11,fontWeight:600,anchor:'middle'});
    }
  });

  // Axes
  const axColor='#374151';
  // Y axis
  s+=`<line x1="${svgX(0)}" y1="${drawYMin}" x2="${svgX(0)}" y2="${drawYMax}" stroke="${axColor}" stroke-width="1.8"/>`;
  // X axis  
  s+=`<line x1="${drawXMin}" y1="${svgY(0)}" x2="${drawXMax}" y2="${svgY(0)}" stroke="${axColor}" stroke-width="1.8"/>`;
  // Arrows
  const ax0=svgX(0),ay0=svgY(0);
  s+=`<polygon points="${ax0-4},${drawYMin+10} ${ax0+4},${drawYMin+10} ${ax0},${drawYMin}" fill="${axColor}"/>`;
  s+=`<polygon points="${drawXMax-10},${ay0-4} ${drawXMax-10},${ay0+4} ${drawXMax},${ay0}" fill="${axColor}"/>`;
  // Labels
  s+=`<text x="${drawXMax+4}" y="${ay0+5}" font-size="13" font-weight="600" fill="${axColor}">${esc(g.xLabel||'X')}</text>`;
  s+=`<text x="${ax0+4}" y="${drawYMin-4}" font-size="13" font-weight="600" fill="${axColor}">${esc(g.yLabel||'Y')}</text>`;
  // Origin
  if(g.showOrigin&&ct!=='q1_no'){
    s+=`<text x="${ax0-14}" y="${ay0+13}" font-size="11" fill="#6b7280">O</text>`;
  }
  // Fixed obstacles for the label-overlap pass below: these never move
  // themselves, but line/point/area name labels get nudged clear of them.
  const fixedLabels=[
    {x:drawXMax+4,y:ay0+5,text:g.xLabel||'X',fontSize:13,fontWeight:600,anchor:'start'},
    {x:ax0+4,y:drawYMin-4,text:g.yLabel||'Y',fontSize:13,fontWeight:600,anchor:'start'}
  ];
  if(g.showOrigin&&ct!=='q1_no') fixedLabels.push({x:ax0-14,y:ay0+13,text:'O',fontSize:11,fontWeight:400,anchor:'start'});
  // Ticks
  if(st){
    const step=ts||2;
    for(let v=Math.ceil(xMin/step)*step;v<=xMax;v+=step){
      if(Math.abs(v)<0.001)continue;
      const gx=svgX(v);
      s+=`<line x1="${gx}" y1="${ay0-3}" x2="${gx}" y2="${ay0+3}" stroke="#9ca3af" stroke-width="1"/>`;
      s+=`<text x="${gx}" y="${ay0+14}" text-anchor="middle" font-size="9" fill="#9ca3af">${+v.toFixed(2)}</text>`;
    }
    for(let v=Math.ceil(yMin/step)*step;v<=yMax;v+=step){
      if(Math.abs(v)<0.001)continue;
      const gy=svgY(v);
      s+=`<line x1="${ax0-3}" y1="${gy}" x2="${ax0+3}" y2="${gy}" stroke="#9ca3af" stroke-width="1"/>`;
      s+=`<text x="${ax0-5}" y="${gy+3}" text-anchor="end" font-size="9" fill="#9ca3af">${+v.toFixed(2)}</text>`;
    }
  }

  // Draw lines
  (g.lines||[]).forEach((l,li)=>{
    const c=l.color||COLORS[li%COLORS.length];
    const da=l.dashed?'stroke-dasharray="7,4"':'';
    const sw=l.w||2;
    const ltype=l.type||'line';
    const slope=parseFloat(l.slope)||0;
    const int_=parseFloat(l.int)||0;
    const curv=parseFloat(l.curv)||1.5;
    // In draw mode → pointer-events:none so clicks pass through to SVG background
    // In select mode → clickable with context menu
    const lineClick=interactive
      ? `onclick="elClick(event,'${g.id}','line',${li})" style="cursor:${S.tool==='select'?'pointer':'default'};pointer-events:${S.tool==='select'?'stroke':'none'}"`
      : '';
    if(ltype==='vert'){
      const vx=parseFloat(l.xv)||5;
      s+=`<line x1="${svgX(vx)}" y1="${drawYMin}" x2="${svgX(vx)}" y2="${drawYMax}" stroke="${c}" stroke-width="${sw}" ${da}/>`;
      // Invisible wide hit area
      if(interactive) s+=`<line x1="${svgX(vx)}" y1="${drawYMin}" x2="${svgX(vx)}" y2="${drawYMax}" stroke="transparent" stroke-width="18" ${lineClick}/>`;
      if(l.name) labelQueue.push({x:svgX(vx)+5,y:drawYMin+14,text:l.name,color:c,anchor:'start'});
    } else if(ltype==='horiz'){
      const hy=parseFloat(l.yv)||5;
      s+=`<line x1="${drawXMin}" y1="${svgY(hy)}" x2="${drawXMax}" y2="${svgY(hy)}" stroke="${c}" stroke-width="${sw}" ${da}/>`;
      if(interactive) s+=`<line x1="${drawXMin}" y1="${svgY(hy)}" x2="${drawXMax}" y2="${svgY(hy)}" stroke="transparent" stroke-width="18" ${lineClick}/>`;
      if(l.name) labelQueue.push({x:drawXMax-30,y:svgY(hy)-5,text:l.name,color:c,anchor:'start'});
    } else if(ltype==='line'){
      let pts=[];
      for(let i=0;i<=60;i++){
        const x=xMin+i*(xMax-xMin)/60;
        const y=slope*x+int_;
        if(y>=yMin&&y<=yMax) pts.push(`${svgX(x)},${svgY(y)}`);
      }
      if(pts.length>1){
        s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="${sw}" ${da} style="pointer-events:none"/>`;
        // Wide transparent hit polyline
        if(interactive) s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="transparent" stroke-width="20" ${lineClick}/>`;
      }
      if(l.name&&pts.length>0){
        const labX=xMin+(xMax-xMin)*0.75;
        const labY=slope*labX+int_;
        if(labY>=yMin&&labY<=yMax) labelQueue.push({x:svgX(labX),y:svgY(labY)-7,text:l.name,color:c,anchor:'start'});
        else if(pts.length>0){const pp=pts[Math.floor(pts.length*.7)].split(',');labelQueue.push({x:parseFloat(pp[0]),y:parseFloat(pp[1])-7,text:l.name,color:c,anchor:'start'});}
      }
    } else if(ltype==='2pt'){
      const x0=parseFloat(l.x0||0),y0=parseFloat(l.y0||0),x1c=parseFloat(l.x1||10),y1c=parseFloat(l.y1||10);
      const pts=[];
      for(let i=0;i<=60;i++){
        const t=i/60;
        const x=x0+t*(x1c-x0);
        const y=y0+t*(y1c-y0);
        if(x>=xMin&&x<=xMax&&y>=yMin&&y<=yMax) pts.push(`${svgX(x)},${svgY(y)}`);
      }
      if(pts.length>1){
        s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="${sw}" ${da} style="pointer-events:none"/>`;
        if(interactive) s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="transparent" stroke-width="20" ${lineClick}/>`;
      }
      if(l.name&&pts.length>0){
        const mp=pts[Math.floor(pts.length/2)].split(',');
        labelQueue.push({x:parseFloat(mp[0])+5,y:parseFloat(mp[1])-5,text:l.name,color:c,anchor:'start'});
      }
    } else if(ltype==='curve'){
      let pts=[];
      const scl=parseInt(l.int)||8;
      for(let i=2;i<=100;i++){
        const t=i/100;
        const x=xMin+0.05+t*(xMax-xMin-0.05);
        const y=Math.pow(scl,curv)/Math.pow(x,curv);
        if(y>=yMin&&y<=yMax&&x>=xMin&&x<=xMax) pts.push(`${svgX(x)},${svgY(y)}`);
      }
      if(pts.length>1){
        s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="${sw}" ${da} style="pointer-events:none"/>`;
        if(interactive) s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="transparent" stroke-width="20" ${lineClick}/>`;
      }
      if(l.name&&pts.length>0){
        const mp=pts[Math.floor(pts.length*.25)];
        const pp=mp.split(',');
        labelQueue.push({x:parseFloat(pp[0])+6,y:parseFloat(pp[1])-5,text:l.name,color:c,anchor:'start'});
      }
    } else if(ltype==='fn'){
      // Safe function plotter: y = a * f(x - h) + k
      const expr=l.fnExpr||'1/x';
      const a=parseFloat(l.fnA)||1;
      const h=parseFloat(l.fnH)||0;
      const k=parseFloat(l.fnK)||0;
      const fn=parseFnExpr(expr);
      if(fn){
        // Plot with discontinuity detection: break polyline when jump is too large
        let segments=[]; let cur=[];
        const steps=300;
        for(let i=0;i<=steps;i++){
          const x=xMin+i*(xMax-xMin)/steps;
          let y;
          try{ y=a*fn(x-h)+k; } catch(e){ y=NaN; }
          if(!isFinite(y)||y<yMin*3||y>yMax*3){
            if(cur.length>1) segments.push(cur);
            cur=[];
          } else {
            cur.push(`${svgX(x)},${svgY(Math.max(yMin,Math.min(yMax,y)))}`);
          }
        }
        if(cur.length>1) segments.push(cur);
        segments.forEach((pts,si)=>{
          if(pts.length<2) return;
          s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="${sw}" ${da} style="pointer-events:none"/>`;
          if(interactive&&si===0) s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="transparent" stroke-width="20" ${lineClick}/>`;
        });
        if(l.name&&segments.length>0){
          const allPts=segments[0];
          const mp=allPts[Math.floor(allPts.length*.6)];
          if(mp){const pp=mp.split(',');labelQueue.push({x:parseFloat(pp[0])+6,y:parseFloat(pp[1])-5,text:l.name,color:c,anchor:'start'});}
        }
      }
    }
    if(l.number&&ltype==='line'){
      const lx=xMax*.8,ly=slope*lx+int_;
      if(ly>=yMin&&ly<=yMax) labelQueue.push({x:svgX(lx),y:svgY(ly)+4,text:l.number,color:c,fontSize:10,fontWeight:700,anchor:'start'});
    }
  });

  // Draw points
  (g.points||[]).forEach((p,pi)=>{
    const c=p.color||'#374151';
    const px=svgX(p.x),py=svgY(p.y);
    // Drop lines
    if(p.dropLines!==false){
      s+=`<line x1="${px}" y1="${py}" x2="${px}" y2="${svgY(0)}" stroke="${c}" stroke-width=".8" stroke-dasharray="4,3" opacity=".5"/>`;
      s+=`<line x1="${px}" y1="${py}" x2="${svgX(0)}" y2="${py}" stroke="${c}" stroke-width=".8" stroke-dasharray="4,3" opacity=".5"/>`;
    }
    s+=`<circle cx="${px}" cy="${py}" r="5.5" fill="${c}" stroke="white" stroke-width="2"`;
    if(interactive) s+=` onclick="elClick(event,'${g.id}','point',${pi})" style="cursor:${S.tool==='select'?'pointer':'default'};pointer-events:${S.tool==='select'?'all':'none'}"`;
    s+=`/>`;
    if(p.label) labelQueue.push({x:px+8,y:py-4,text:p.label,color:c,anchor:'start'});
  });

  // Resolve overlaps among line/point/area name labels (and against the axis
  // titles/origin), then draw them all on top of every shape at once.
  resolveLabelOverlaps(labelQueue,fixedLabels).forEach(l=>{
    const anchorAttr=l.anchor&&l.anchor!=='start'?` text-anchor="${l.anchor}"`:'';
    s+=`<text x="${l.x}" y="${l.y}"${anchorAttr} font-size="${l.fontSize||12}" font-weight="${l.fontWeight||600}" fill="${l.color||'#374151'}" style="pointer-events:none">${esc(l.text)}</text>`;
  });

  // Draw preview (in-progress line or area)
  if(interactive && S.drawState && S.drawState.gid===g.id){
    const ds=S.drawState;
    if(ds.pts&&ds.pts.length>0){
      // Connecting lines between placed points
      if(ds.pts.length>1){
        const previewPts=ds.pts.map(p=>`${svgX(p.x)},${svgY(p.y)}`).join(' ');
        s+=`<polyline points="${previewPts}" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" opacity=".8" style="pointer-events:none"/>`;
      }
      // Closing dashed line back to start for area (when 3+ points)
      if(ds.type==='area'&&ds.pts.length>=3){
        const first=ds.pts[0], last=ds.pts[ds.pts.length-1];
        s+=`<line x1="${svgX(last.x)}" y1="${svgY(last.y)}" x2="${svgX(first.x)}" y2="${svgY(first.y)}" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,4" opacity=".35" style="pointer-events:none"/>`;
        // Semi-transparent fill preview
        const polyPts=ds.pts.map(p=>`${svgX(p.x)},${svgY(p.y)}`).join(' ');
        s+=`<polygon points="${polyPts}" fill="#2563eb" fill-opacity=".07" style="pointer-events:none"/>`;
      }
      // Numbered vertex dots for all placed points
      ds.pts.forEach((p,pi)=>{
        s+=`<circle cx="${svgX(p.x)}" cy="${svgY(p.y)}" r="5.5" fill="#2563eb" stroke="white" stroke-width="2" opacity=".9" style="pointer-events:none"/>`;
        s+=`<text x="${svgX(p.x)+8}" y="${svgY(p.y)-5}" font-size="9" fill="#2563eb" font-weight="600" opacity=".9" style="pointer-events:none">${pi+1}</text>`;
      });
    }
  }

  // Snap indicator ring (rendered from hover state)
  if(interactive && _hoverSnap && _hoverSnap.gid===g.id && S.tool!=='select'){
    const sp=_hoverSnap.point;
    const scx=svgX(sp.x), scy=svgY(sp.y);
    const snapped=sp.snapped;
    s+=`<circle cx="${scx}" cy="${scy}" r="${snapped?7:5}" fill="${snapped?'rgba(22,163,74,0.15)':'rgba(100,100,100,0.08)'}" stroke="${snapped?'#16a34a':'#9ca3af'}" stroke-width="${snapped?2:1.5}" stroke-dasharray="${snapped?'none':'3,2'}" opacity="${snapped?0.95:0.6}" style="pointer-events:none"/>`;
    if(snapped){
      s+=`<line x1="${scx-10}" y1="${scy}" x2="${scx+10}" y2="${scy}" stroke="#16a34a" stroke-width="1" opacity="0.6" style="pointer-events:none"/>`;
      s+=`<line x1="${scx}" y1="${scy-10}" x2="${scx}" y2="${scy+10}" stroke="#16a34a" stroke-width="1" opacity="0.6" style="pointer-events:none"/>`;
      const kindLabel=sp.kind==='grid'?'격자':'교차점';
      s+=`<text x="${scx+11}" y="${scy-9}" font-size="9" fill="#16a34a" font-weight="600" style="pointer-events:none">${kindLabel} (${+sp.x.toFixed(1)},${+sp.y.toFixed(1)})</text>`;
    }
  }

  // Selection handles (drawn last so they're on top)
  if(interactive && typeof drawSelectionHandles==='function') s=drawSelectionHandles(g,s,svgX,svgY);

  s+=`</svg>`;
  return {svg:s, svgX, svgY};
}

// ==================== RENDER ALL ====================
function renderAll(){
  const grid=document.getElementById('graph-grid');
  const empty=document.getElementById('empty-state');
  document.getElementById('tb-status').textContent=S.graphs.length?`${S.graphs.length}개`:'그래프 없음';
  empty.style.display=S.graphs.length?'none':'block';
  grid.style.display=S.graphs.length?'grid':'none';
  // getMinColWidth() also refreshes each auto-mode graph's canvasW/H (see getCanvasDims)
  grid.style.gridTemplateColumns=`repeat(${getGridCols()},minmax(${getMinColWidth()}px,1fr))`;

  const n=S.graphs.length;
  const sizeClass=n===1?'':n===2?' compact':' compact3';
  grid.innerHTML=S.graphs.map(g=>{
    const sel=g.id===S.selectedId;
    const {svg}=renderSVG(g,true);
    const eqs=(g.lines||[]).filter(l=>l.eq);
    const eqHtml=eqs.length?`<div class="eq-list">${eqs.map(l=>`<div class="eq-item"><span class="eq-dot" style="background:${l.color||'#2563eb'}${l.dashed?';border-top:2px dashed'+l.color:''}"></span><span><b style="color:${l.color||'#2563eb'}">${esc(l.name||'')}</b>${l.eq?' : '+esc(l.eq):''}</span></div>`).join('')}</div>`:'';
    return `<div class="graph-card${sel?' selected':''}${sizeClass}" onclick="selectGraph('${g.id}')">
      <div class="card-top-btns">
        <button class="cbtn" onclick="event.stopPropagation();openEditMeta('${g.id}')">편집</button>
        <button class="cbtn" onclick="event.stopPropagation();saveAsPreset('${g.id}')">★ 프리셋</button>
        <button class="cbtn" onclick="event.stopPropagation();exportSingle('${g.id}')">↓</button>
        <button class="cbtn danger" onclick="event.stopPropagation();delGraph('${g.id}')">✕</button>
      </div>
      ${g.title?`<div class="card-title">${esc(g.title)}</div>`:''}
      ${g.desc?`<div class="card-desc">${esc(g.desc)}</div>`:''}
      <div class="graph-svg-wrap" id="wrap-${g.id}">${svg}</div>
      ${eqHtml}
    </div>`;
  }).join('');

  renderGraphList();
  renderCoordPanel();
  updateDrawCursor();
  updateDrawActionsBar();
}

// ==================== TOOL MANAGEMENT ====================
function setTool(t){
  const prev=S.tool;
  S.tool=t;
  if(prev!==t) S.drawState=null; // only reset when actually changing tool
  // Update sidebar tool buttons
  ['select','point','line','area'].forEach(n=>{
    const b=document.getElementById('tool-'+n+'-btn');
    if(b) b.classList.toggle('active', n===t);
  });
  // Update mobile tab buttons
  ['select','point','line','area'].forEach(n=>{
    const b=document.getElementById('mtab-'+n);
    if(b) b.classList.toggle('active', n===t);
  });
  showIndicator(
    t==='select'?null:
    t==='point'?'그래프 위 클릭하여 점 추가':
    t==='line'?'첫 번째 점을 클릭하세요':
    '클릭으로 꼭짓점 추가 → "면 완성" 버튼'
  );
  updateDrawCursor();
  updateDrawActionsBar();
}

function showIndicator(msg){
  const el=document.getElementById('tool-indicator');
  if(!el)return;
  if(!msg){el.style.display='none';return;}
  el.textContent=msg; el.style.display='block';
}

function updateDrawCursor(){
  const wrap=document.getElementById('canvas-wrap');
  if(!wrap)return;
  if(S.tool!=='select') wrap.classList.add('draw-mode');
  else wrap.classList.remove('draw-mode');
}

function updateDrawActionsBar(){
  const bar=document.getElementById('draw-actions');
  if(!bar)return;
  const drawing=S.drawState&&S.drawState.pts&&S.drawState.pts.length>0;
  const canFinishArea=S.tool==='area'&&S.drawState&&S.drawState.pts.length>=3;
  const canCancelLine=S.tool==='line'&&S.drawState&&S.drawState.pts.length>0;

  if(canFinishArea||canCancelLine||drawing){
    bar.style.display='flex';
    bar.innerHTML=`
      ${canFinishArea?`<button class="tb-btn primary" onclick="finishArea()">✓ 면 완성 (${S.drawState.pts.length}점)</button>`:''}
      ${drawing?`<button class="tb-btn" onclick="cancelDraw()">✕ 취소</button>`:''}`;
  } else {
    bar.style.display='none';
    bar.innerHTML='';
  }
}

function renderGraphList(){
  const el=document.getElementById('graph-list');
  el.innerHTML=S.graphs.length?S.graphs.map((g,i)=>`
    <div class="graph-item${g.id===S.selectedId?' active':''}" onclick="selectGraph('${g.id}')">
      <div class="gi-color" style="background:${g.lines?.[0]?.color||COLORS[i%COLORS.length]}"></div>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.title||'그래프'+(i+1))}</span>
      <span class="gi-del" onclick="event.stopPropagation();delGraph('${g.id}')">✕</span>
    </div>`).join(''):
    '<div style="padding:12px;text-align:center;color:#9ca3af;font-size:11px">없음</div>';
}

function selectGraph(id){
  S.selectedId=id;
  S.drawState=null;
  renderAll();
  renderCoordPanel();
  renderRPanel(null);
}

function delGraph(id){
  S.graphs=S.graphs.filter(g=>g.id!==id);
  if(S.selectedId===id) S.selectedId=S.graphs[0]?.id||null;
  S.drawState=null;
  renderAll();
  renderCoordPanel();
  renderRPanel(null);
}

// ==================== COORD PANEL (sidebar) ====================
function renderCoordPanel(){
  const g=G();
  const el=document.getElementById('coord-panel');
  if(!g){el.innerHTML='<div style="font-size:10px;color:#9ca3af">그래프를 선택하세요</div>';return;}
  el.innerHTML=`
    <div class="form-group">
      <label>좌표계 유형</label>
      <select onchange="upG('${g.id}','coordType',this.value);renderAll()">
        ${[['q1','1사분면'],['q1_no','1사분면(원점無)'],['q14','1·4사분면'],['all','4사분면']].map(([v,n])=>`<option value="${v}"${g.coordType===v?' selected':''}>${n}</option>`).join('')}
      </select>
    </div>
    <div class="row" style="gap:5px">
      <div class="col"><label>X최소</label><input type="number" value="${g.xMin}" onchange="upG('${g.id}','xMin',+this.value);renderAll()" style="width:100%"></div>
      <div class="col"><label>X최대</label><input type="number" value="${g.xMax}" onchange="upG('${g.id}','xMax',+this.value);renderAll()" style="width:100%"></div>
    </div>
    <div class="row" style="gap:5px">
      <div class="col"><label>Y최소</label><input type="number" value="${g.yMin}" onchange="upG('${g.id}','yMin',+this.value);renderAll()" style="width:100%"></div>
      <div class="col"><label>Y최대</label><input type="number" value="${g.yMax}" onchange="upG('${g.id}','yMax',+this.value);renderAll()" style="width:100%"></div>
    </div>
    <div class="form-group">
      <label>눈금 간격</label>
      <input type="number" value="${g.tickStep||2}" min="0.5" step="0.5" onchange="upG('${g.id}','tickStep',+this.value);renderAll()">
    </div>
    <div class="row" style="gap:5px;flex-wrap:wrap">
      <label class="chk"><input type="checkbox" ${g.showGrid!==false?'checked':''} onchange="upG('${g.id}','showGrid',this.checked);renderAll()"> 그리드</label>
      <label class="chk"><input type="checkbox" ${g.showTicks!==false?'checked':''} onchange="upG('${g.id}','showTicks',this.checked);renderAll()"> 눈금</label>
      <label class="chk"><input type="checkbox" ${g.showOrigin!==false?'checked':''} onchange="upG('${g.id}','showOrigin',this.checked);renderAll()"> 원점</label>
    </div>
    <div class="row" style="gap:5px">
      <div class="col"><label>X축 라벨</label><input type="text" value="${esc(g.xLabel||'Q')}" onchange="upG('${g.id}','xLabel',this.value);renderAll()"></div>
      <div class="col"><label>Y축 라벨</label><input type="text" value="${esc(g.yLabel||'P')}" onchange="upG('${g.id}','yLabel',this.value);renderAll()"></div>
    </div>
    <div style="border-top:1px solid #f0f0ec;margin-top:6px;padding-top:6px">
      ${canvasSizeControlsHtml(g)}
    </div>`;
}

function upG(id,k,v){const g=GbyId(id);if(g)g[k]=v;}

// ==================== RIGHT PANEL ====================
function renderRPanel(ctx){
  const body=document.getElementById('rpanel-body');
  const title=document.getElementById('rpanel-title');
  const close=document.getElementById('rpanel-close');
  const g=G();

  if(!ctx){
    // Show graph-level element list
    close.style.display='none';
    if(!g){title.textContent='속성';body.innerHTML='<div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px">그래프를 선택하거나<br>요소를 클릭하세요</div>';return;}
    title.textContent=esc(g.title||'그래프');
    let html=``;

    html+=`<div class="pf-group">
      <div class="pf-title">📐 좌표계 / 격자</div>
      <div class="row" style="gap:5px">
        <div class="col"><label>X범위</label><div class="row" style="gap:3px"><input type="number" value="${g.xMin}" onchange="upG('${g.id}','xMin',+this.value);renderAll()" style="width:100%"><input type="number" value="${g.xMax}" onchange="upG('${g.id}','xMax',+this.value);renderAll()" style="width:100%"></div></div>
      </div>
      <div class="row" style="gap:5px">
        <div class="col"><label>Y범위</label><div class="row" style="gap:3px"><input type="number" value="${g.yMin}" onchange="upG('${g.id}','yMin',+this.value);renderAll()" style="width:100%"><input type="number" value="${g.yMax}" onchange="upG('${g.id}','yMax',+this.value);renderAll()" style="width:100%"></div></div>
      </div>
      <div class="form-group"><label>눈금 간격</label><input type="number" value="${g.tickStep||2}" min="0.5" step="0.5" onchange="upG('${g.id}','tickStep',+this.value);renderAll()"></div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <label class="chk"><input type="checkbox" ${g.showGrid!==false?'checked':''} onchange="upG('${g.id}','showGrid',this.checked);renderAll()"> 그리드 표시</label>
        <label class="chk"><input type="checkbox" ${g.showTicks!==false?'checked':''} onchange="upG('${g.id}','showTicks',this.checked);renderAll()"> 눈금 표시</label>
        <label class="chk"><input type="checkbox" ${g.showOrigin!==false?'checked':''} onchange="upG('${g.id}','showOrigin',this.checked);renderAll()"> 원점</label>
      </div>
      <div style="border-top:1px solid #e5e5e3;margin-top:4px;padding-top:6px">
        <div class="pf-title" style="margin-bottom:4px">🖼 캔버스 크기</div>
        ${canvasSizeControlsHtml(g)}
      </div>
    </div>`;

    // Lines
    html+=`<div class="rp-section">선 / 곡선</div>`;
    (g.lines||[]).forEach((l,i)=>{
      const isSel=S.sel&&S.sel.gid===g.id&&S.sel.type==='line'&&S.sel.idx===i;
      html+=`<div class="rp-item${isSel?' active':''}" onclick="selectElement('${g.id}','line',${i})">
        <div class="rp-dot" style="background:${l.color||'#2563eb'}"></div>
        <span class="rp-name">${esc(l.name||'선'+(i+1))} <span style="color:#9ca3af;font-size:9px">${l.type||'line'}</span></span>
        ${isSel?`<button class="cbtn" onclick="event.stopPropagation();openElProps()" style="font-size:10px;padding:2px 6px">속성</button>`:''}
        <span class="rp-del" onclick="event.stopPropagation();delLine('${g.id}',${i})">✕</span>
      </div>`;
    });
    html+=`<button class="tb-btn" style="width:100%;justify-content:center;font-size:11px;background:#eff6ff;border-color:#93c5fd;color:#1d4ed8" onclick="openFnDialog()">𝑓 함수식으로 추가 (쌍곡선·루트·승수 등)</button>`;
    html+=`<button class="tb-btn" style="width:100%;justify-content:center;font-size:11px;margin-top:3px" onclick="setTool('line');if(isMobile())mobileShow('canvas')">📏 두 점으로 직선 그리기</button>`;
    html+=`<button class="tb-btn" style="width:100%;justify-content:center;font-size:11px;margin-top:3px" onclick="addLineDialog('${g.id}')">⊞ 기울기/절편으로 추가</button>`;

    // Points
    html+=`<div class="rp-section" style="margin-top:8px">점</div>`;
    (g.points||[]).forEach((p,i)=>{
      const isSel=S.sel&&S.sel.gid===g.id&&S.sel.type==='point'&&S.sel.idx===i;
      html+=`<div class="rp-item${isSel?' active':''}" onclick="selectElement('${g.id}','point',${i})">
        <div class="rp-dot" style="background:${p.color||'#374151'}"></div>
        <span class="rp-name">${esc(p.label||'점'+(i+1))} <span style="color:#9ca3af;font-size:9px">(${+p.x.toFixed(1)},${+p.y.toFixed(1)})</span></span>
        ${isSel?`<button class="cbtn" onclick="event.stopPropagation();openElProps()" style="font-size:10px;padding:2px 6px">속성</button>`:''}
        <span class="rp-del" onclick="event.stopPropagation();delPoint('${g.id}',${i})">✕</span>
      </div>`;
    });
    html+=`<button class="tb-btn" style="width:100%;justify-content:center;font-size:11px" onclick="setTool('point')">+ 점 추가 (클릭)</button>`;

    // Areas
    html+=`<div class="rp-section" style="margin-top:8px">면 (영역)</div>`;
    (g.areas||[]).forEach((a,i)=>{
      const isSel=S.sel&&S.sel.gid===g.id&&S.sel.type==='area'&&S.sel.idx===i;
      html+=`<div class="rp-item${isSel?' active':''}" onclick="selectElement('${g.id}','area',${i})">
        <div class="rp-dot" style="background:${a.color||'#3b82f6'}"></div>
        <span class="rp-name">${esc(a.label||'영역'+(i+1))}${a.hatch?' 빗금':''}</span>
        ${isSel?`<button class="cbtn" onclick="event.stopPropagation();openElProps()" style="font-size:10px;padding:2px 6px">속성</button>`:''}
        <span class="rp-del" onclick="event.stopPropagation();delArea('${g.id}',${i})">✕</span>
      </div>`;
    });
    html+=`<button class="tb-btn" style="width:100%;justify-content:center;font-size:11px" onclick="setTool('area');if(isMobile())mobileShow('canvas')">🎨 면 그리기 도구로 추가</button>`;

    body.innerHTML=html;
    return;
  }

  // Show specific element editor
  close.style.display='block';
  const {type,idx}=ctx;
  if(!g) return;

  if(type==='line'){
    const l=g.lines[idx];
    if(!l){renderRPanel(null);return;}
    title.textContent='선 편집';
    body.innerHTML=lineEditor(g.id,idx,l);
  } else if(type==='point'){
    const p=g.points[idx];
    if(!p){renderRPanel(null);return;}
    title.textContent='점 편집';
    body.innerHTML=pointEditor(g.id,idx,p);
  } else if(type==='area'){
    const a=g.areas[idx];
    if(!a){renderRPanel(null);return;}
    title.textContent='면 편집';
    body.innerHTML=areaEditor(g.id,idx,a);
  }
}

// ==================== ELEMENT EDITORS ====================
function lineEditor(gid,idx,l){
  const typOpts=[['line','직선'],['curve','쌍곡선형 곡선'],['fn','함수식 y=f(x)'],['vert','수직선'],['horiz','수평선'],['2pt','두 점 선']]
    .map(([v,n])=>`<option value="${v}"${l.type===v?' selected':''}>${n}</option>`).join('');
  const paramSection=
    l.type==='line'?`<div class="pf-group"><div class="pf-title">직선 파라미터</div>
      <div class="row" style="gap:5px">
        <div class="col"><label>기울기</label><input type="number" value="${l.slope||0}" step="0.1" oninput="upLine('${gid}',${idx},'slope',+this.value)"></div>
        <div class="col"><label>Y절편</label><input type="number" value="${l.int||0}" step="0.5" oninput="upLine('${gid}',${idx},'int',+this.value)"></div>

    l.type==='2pt'?`<div class="pf-group"><div class="pf-title">두 점</div>
      <div class="row" style="gap:5px">
        <div class="col"><label>X₀</label><input type="number" value="${l.x0||0}" step="0.5" oninput="upLine('${gid}',${idx},'x0',+this.value)"></div>
        <div class="col"><label>Y₀</label><input type="number" value="${l.y0||0}" step="0.5" oninput="upLine('${gid}',${idx},'y0',+this.value)"></div>
      </div>
      <div class="row" style="gap:5px">
        <div class="col"><label>X₁</label><input type="number" value="${l.x1||10}" step="0.5" oninput="upLine('${gid}',${idx},'x1',+this.value)"></div>
        <div class="col"><label>Y₁</label><input type="number" value="${l.y1||10}" step="0.5" oninput="upLine('${gid}',${idx},'y1',+this.value)"></div>
      </div></div>`:
    l.type==='curve'?`<div class="pf-group"><div class="pf-title">곡선 파라미터</div>
      <div class="form-group"><label>스케일</label><input type="number" value="${l.int||8}" step="0.5" oninput="upLine('${gid}',${idx},'int',+this.value)"></div>
      <div><label>곡률 <span id="cv-v">${l.curv||1.5}</span></label>
        <input type="range" min=".5" max="4" step=".1" value="${l.curv||1.5}" oninput="document.getElementById('cv-v').textContent=this.value;upLine('${gid}',${idx},'curv',+this.value)">
      </div></div>`:
    l.type==='vert'?`<div class="pf-group"><div class="pf-title">수직선</div>
      <label>X 위치</label><input type="number" value="${l.xv||5}" step=".5" oninput="upLine('${gid}',${idx},'xv',+this.value)"></div>`:
    l.type==='horiz'?`<div class="pf-group"><div class="pf-title">수평선</div>
      <label>Y 위치</label><input type="number" value="${l.yv||5}" step=".5" oninput="upLine('${gid}',${idx},'yv',+this.value)"></div>`:
    l.type==='fn'?`<div class="pf-group">
      <div class="pf-title">함수식 y = f(x)</div>
      <div class="form-group">
        <label>수식 입력</label>
        <input type="text" value="${esc(l.fnExpr||'1/x')}" oninput="upLine('${gid}',${idx},'fnExpr',this.value)" placeholder="예: 1/x, sqrt(x), x^2, 2*x^0.5"
          style="font-family:monospace;font-size:13px">
        <div style="font-size:10px;color:#9ca3af;margin-top:3px">x, +, -, *, /, ^(거듭제곱), sqrt(), abs(), ln() 사용 가능</div>
      </div>
      <div class="form-group">
        <label>빠른 선택</label>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${[['1/x','쌍곡선'],['sqrt(x)','루트'],['x^2','이차'],['x^0.5','루트(동일)'],
             ['2/x','2배 쌍곡선'],['1/x^2','역제곱'],['ln(x)','로그'],['x^(1/3)','세제곱근'],
             ['2*sqrt(x)','2√x'],['x^2/4','완만한 포물선']
            ].map(([expr,label])=>`<button class="cbtn" style="font-size:10px;padding:3px 7px" onclick="upLine('${gid}',${idx},'fnExpr','${expr}');this.closest('.pf-group').querySelector('input').value='${expr}'">${label}<br><span style="font-family:monospace;font-size:9px;color:#9ca3af">${expr}</span></button>`).join('')}
        </div>
      </div>
      <div class="row" style="gap:5px">
        <div class="col"><label>배율 a <span style="font-size:9px;color:#9ca3af">(◆ 핸들)</span></label><input type="number" value="${l.fnA||1}" step="0.1" data-fnparam="a" oninput="upLine('${gid}',${idx},'fnA',+this.value)" title="y = a × f(x)"></div>
        <div class="col"><label>x 이동 h <span style="font-size:9px;color:#9ca3af">(h 핸들)</span></label><input type="number" value="${l.fnH||0}" step="0.5" data-fnparam="h" oninput="upLine('${gid}',${idx},'fnH',+this.value)" title="f(x - h)"></div>
        <div class="col"><label>y 이동 k <span style="font-size:9px;color:#9ca3af">(↕ 핸들)</span></label><input type="number" value="${l.fnK||0}" step="0.5" data-fnparam="k" oninput="upLine('${gid}',${idx},'fnK',+this.value)" title="y + k"></div>
      </div>
      <div style="font-size:10px;color:#9ca3af;margin-top:2px">최종 식: y = a × f(x − h) + k</div>
      <div style="font-size:10px;color:#2563eb;margin-top:4px;line-height:1.6">
        💡 그래프 위 핸들을 드래그해서 편집:<br>
        &nbsp;↕ 본체 = y이동(k) &nbsp;|&nbsp; h = x이동 &nbsp;|&nbsp; a = 배율 &nbsp;|&nbsp; ◆ = 형태(a)
      </div>
    </div>`:'';
  return `
    <div class="pf-group">
      <div class="pf-title">기본 정보</div>
      <div class="form-group"><label>이름</label><input type="text" value="${esc(l.name||'')}" oninput="upLine('${gid}',${idx},'name',this.value)"></div>
      <div class="form-group"><label>방정식 (표시용)</label><input type="text" value="${esc(l.eq||'')}" oninput="upLine('${gid}',${idx},'eq',this.value)" placeholder="예: P = -Q + 10"></div>
      <div class="form-group"><label>유형</label>
        <select onchange="upLine('${gid}',${idx},'type',this.value);renderAll();renderRPanel({type:'line',idx:${idx}})">${typOpts}</select>
      </div>
    </div>
    ${paramSection}
    <div class="pf-group">
      <div class="pf-title">스타일</div>
      <div class="row" style="gap:6px;margin-bottom:6px">
        <div class="col"><label>색상 프리셋</label>
          <select onchange="upLine('${gid}',${idx},'color',this.value)">${COLORS.map(c=>`<option value="${c}"${l.color===c?' selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px"><label>직접</label>
          <input type="color" value="${l.color||'#2563eb'}" onchange="upLine('${gid}',${idx},'color',this.value)">
        </div>
      </div>
      <label class="chk" style="margin-bottom:6px"><input type="checkbox" ${l.dashed?'checked':''} onchange="upLine('${gid}',${idx},'dashed',this.checked)"> 점선</label>
      <div><label>굵기 <span id="lw-v">${l.w||2}</span></label>
        <input type="range" min="1" max="6" step=".5" value="${l.w||2}" oninput="document.getElementById('lw-v').textContent=this.value;upLine('${gid}',${idx},'w',+this.value)">
      </div>
    </div>
    <div class="pf-group">
      <label>넘버링</label><input type="text" value="${esc(l.number||'')}" oninput="upLine('${gid}',${idx},'number',this.value)" placeholder="예: ₁, ₂">
    </div>
    <button class="tb-btn" style="width:100%;justify-content:center;color:#dc2626;margin-top:4px" onclick="delLine('${gid}',${idx})">선 삭제</button>`;
}

      <div class="pf-title">좌표</div>
      <div class="row" style="gap:5px">
        <div class="col"><label>X</label><input type="number" value="${p.x}" step=".5" data-coord="px" oninput="upPoint('${gid}',${idx},'x',+this.value)"></div>
        <div class="col"><label>Y</label><input type="number" value="${p.y}" step=".5" data-coord="py" oninput="upPoint('${gid}',${idx},'y',+this.value)"></div>

    </div>
    <div class="pf-group">
      <div class="pf-title">표시</div>
      <div class="form-group"><label>라벨</label><input type="text" value="${esc(p.label||'')}" oninput="upPoint('${gid}',${idx},'label',this.value)" placeholder="예: A, E*"></div>
      <div class="row" style="gap:6px"><label>색상</label><input type="color" value="${p.color||'#374151'}" onchange="upPoint('${gid}',${idx},'color',this.value)"></div>
      <label class="chk" style="margin-top:4px"><input type="checkbox" ${p.dropLines!==false?'checked':''} onchange="upPoint('${gid}',${idx},'dropLines',this.checked)"> 드롭 점선</label>

function areaEditor(gid,idx,a){
  const ptsStr=(a.pts||[]).map(p=>`${p.x},${p.y}`).join('\n');
  return `
    <div class="pf-group">
      <div class="pf-title">라벨</div>
      <input type="text" value="${esc(a.label||'')}" oninput="upArea('${gid}',${idx},'label',this.value)" placeholder="예: CS, DWL">
    </div>
    <div class="pf-group">
      <div class="pf-title">꼭짓점 (x,y 한 줄씩)</div>
      <textarea rows="5" style="width:100%;font-family:monospace;font-size:11px" oninput="upAreaPts('${gid}',${idx},this.value)">${esc(ptsStr)}</textarea>
    </div>
    <div class="pf-group">
      <div class="pf-title">스타일</div>
      <div class="row" style="gap:6px;margin-bottom:6px"><label>색상</label><input type="color" value="${a.color||'#3b82f6'}" onchange="upArea('${gid}',${idx},'color',this.value)"></div>
      <label class="chk"><input type="checkbox" ${a.hatch?'checked':''} onchange="upArea('${gid}',${idx},'hatch',this.checked)"> 빗금</label>
    </div>
    <button class="tb-btn" style="width:100%;justify-content:center;color:#dc2626;margin-top:4px" onclick="delArea('${gid}',${idx})">면 삭제</button>`;
}

// Update helpers
function upLine(gid,idx,k,v){const g=GbyId(gid);if(!g||!g.lines[idx])return;g.lines[idx][k]=v;renderAll();}
function upPoint(gid,idx,k,v){const g=GbyId(gid);if(!g||!g.points[idx])return;g.points[idx][k]=v;renderAll();}
function upArea(gid,idx,k,v){const g=GbyId(gid);if(!g||!g.areas[idx])return;g.areas[idx][k]=v;renderAll();}
function upAreaPts(gid,idx,raw){
  const g=GbyId(gid);if(!g||!g.areas[idx])return;
  g.areas[idx].pts=raw.trim().split('\n').map(l=>{const p=l.split(',');return{x:parseFloat(p[0])||0,y:parseFloat(p[1])||0};}).filter(p=>!isNaN(p.x));
  renderAll();
}
function delLine(gid,idx){const g=GbyId(gid);if(!g)return;g.lines.splice(idx,1);S.sel=null;renderAll();renderRPanel(null);}
function delPoint(gid,idx){const g=GbyId(gid);if(!g)return;g.points.splice(idx,1);S.sel=null;renderAll();renderRPanel(null);}
function delArea(gid,idx){const g=GbyId(gid);if(!g)return;g.areas.splice(idx,1);S.sel=null;renderAll();renderRPanel(null);}

function clearRPanel(){renderRPanel(null);}

// S.sel = {gid, type, idx}  selected element (no auto rpanel on create)
S.sel=null;

function selectElement(gid,type,idx){
  if(S.tool!=='select')return;
  S.selectedId=gid;
  S.sel={gid,type,idx};
  renderAll();
  renderRPanel(null); // show LIST view only — user clicks "속성" to open detail
}

function openElProps(){
  if(!S.sel)return;
  renderRPanel({type:S.sel.type,idx:S.sel.idx});
  document.getElementById('rpanel-close').style.display='block';
  if(typeof isMobile==='function'&&isMobile()) mobileShow('rpanel');
}

function clearSelection(){
  S.sel=null;
  renderRPanel(null);
  renderAll();
}

// ==================== CONTEXT MINI-MENU ====================
let _ctxMenu=null;

function showCtxMenu(gid,type,idx,screenX,screenY){
  S.sel={gid,type,idx};
  renderAll(); // refresh handles
  let el=document.getElementById('ctx-menu');
  if(!el){
    el=document.createElement('div');
    el.id='ctx-menu';
    el.style.cssText='position:fixed;background:#fff;border:1px solid #e0e0e0;border-radius:9px;'+
      'box-shadow:0 4px 20px rgba(0,0,0,.14);z-index:9999;min-width:130px;overflow:hidden;font-size:12px;font-family:system-ui,sans-serif';
    document.body.appendChild(el);
  }
  const typeName=type==='line'?'선':type==='point'?'점':'면';
  el.innerHTML=`
    <div style="padding:5px 11px;font-size:10px;font-weight:600;color:#9ca3af;border-bottom:1px solid #f0f0ec;background:#f8f8f6">${typeName}</div>
    <div class="ctx-item" onclick="openElProps()">⚙️ 속성 편집</div>
    <div class="ctx-item" onclick="duplicateEl('${gid}','${type}',${idx})">⧉ 복제</div>
    <div class="ctx-item ctx-danger" onclick="deleteEl('${gid}','${type}',${idx})">🗑 삭제</div>`;
  el.style.display='block';
  const vw=window.innerWidth,vh=window.innerHeight;
  let lx=screenX+10,ly=screenY+10;
  if(lx+150>vw) lx=screenX-160;
  if(ly+120>vh) ly=screenY-130;
  el.style.left=lx+'px'; el.style.top=ly+'px';
  // close on outside click
  setTimeout(()=>document.addEventListener('pointerdown',_hideCtxOutside,{capture:true,once:true}),0);
}

function _hideCtxOutside(e){
  const el=document.getElementById('ctx-menu');
  if(el&&!el.contains(e.target)) hideCtxMenu();
}

function hideCtxMenu(){
  const el=document.getElementById('ctx-menu');
  if(el) el.style.display='none';
}

function duplicateEl(gid,type,idx){
  const g=GbyId(gid);if(!g)return;
  if(type==='line'){const l=JSON.parse(JSON.stringify(g.lines[idx]));l.name+="'";g.lines.push(l);}
  else if(type==='point'){const p=JSON.parse(JSON.stringify(g.points[idx]));p.x=roundCoord(p.x+0.5);p.y=roundCoord(p.y+0.5);p.label+="'";g.points.push(p);}
  else if(type==='area'){const a=JSON.parse(JSON.stringify(g.areas[idx]));a.label+="'";g.areas.push(a);}
  hideCtxMenu();renderAll();
}

function deleteEl(gid,type,idx){
  if(type==='line') delLine(gid,idx);
  else if(type==='point') delPoint(gid,idx);
  else{delArea(gid,idx);}
  hideCtxMenu();S.sel=null;renderAll();
}
